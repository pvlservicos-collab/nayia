# O nginx do site (container nay-site-web, nginx:alpine), montado em /etc/nginx/conf.d/default.conf.
# A cópia que vale é /docker/nay-site-web/nginx-default.conf no srv1894338; esta é o registro no repositório.
# Mudou? Edite lá (ou copie esta) e rode:
#   docker exec nay-site-web nginx -t && docker exec nay-site-web nginx -s reload
# A compressão (gzip) NÃO é daqui: é o Traefik, na frente, com o middleware nay-site-compress
# (rótulos nos docker-compose de nay-site-web e nay-site-api; ver scripts/servidor/compressao_traefik.md).

# 06/10/2026 (Pedro: "otimiza o /imoveis para carregar rápido"): .js/.css pedidos com ?v=... são versionados
# (a página troca o v a cada publicação), então podem ficar um ano no navegador. Sem ?v=, revalidam a cada
# visita, como antes. Página .html nunca leva ?v=.
map $arg_v $cache_estatico {
    ""       "no-cache, must-revalidate";
    default  "public, max-age=31536000, immutable";
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    # /imoveis, /comprar... (sem extensão) são páginas: sempre revalidar. Antes saíam SEM Cache-Control e o
    # navegador guardava por conta própria -- era isso que fazia a tela nova não aparecer depois de publicar.
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # O BLOG (406, 17/10): css/js/img do blog moram aqui (imobeasy.online/blog/...); o resto de /blog é o subdomínio
    # blog.imobeasy.online (a API renderiza as páginas). Quem abrir imobeasy.online/blog vai para lá.
    location ^~ /blog/css/ { add_header Cache-Control $cache_estatico always; }
    location ^~ /blog/js/  { add_header Cache-Control $cache_estatico always; }
    location ^~ /blog/img/ { add_header Cache-Control "public, max-age=604800" always; }
    location = /blog { return 301 https://blog.imobeasy.online/; }
    location ~ ^/blog/(.*)$ { return 301 https://blog.imobeasy.online/$1; }

    # a página pública do imóvel: /imovel/<código> serve imovel.html (02/10)
    location ^~ /imovel/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /imovel.html =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location ~* \.(?:js|css)$ {
        add_header Cache-Control $cache_estatico always;
    }
    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
