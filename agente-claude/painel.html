<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente Claude</title>
<style>
:root {
  --fundo: #f4f4f2; --superficie: #fcfcfb; --borda: #e2e1dc; --texto: #0b0b0b; --texto-2: #52514e; --texto-3: #8a8983;
  --azul: #2a78d6; --azul-forte: #1c5cab; --erro: #d03b3b; --ok: #0ca30c; --grade: #ecebe7; --raio: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #111110; --superficie: #1a1a19; --borda: #2e2e2b; --texto: #f0efec; --texto-2: #c3c2b7; --texto-3: #8f8e86;
    --azul: #3987e5; --azul-forte: #6da7ec; --erro: #e66767; --ok: #2fbf2f; --grade: #262624;
  }
}
:root[data-theme="dark"] {
  --fundo: #111110; --superficie: #1a1a19; --borda: #2e2e2b; --texto: #f0efec; --texto-2: #c3c2b7; --texto-3: #8f8e86;
  --azul: #3987e5; --azul-forte: #6da7ec; --erro: #e66767; --ok: #2fbf2f; --grade: #262624;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fundo); color: var(--texto); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--borda); background: var(--superficie); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 17px; margin: 0; flex: 1; }
header a { color: var(--texto-2); text-decoration: none; font-size: 14px; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
section { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); padding: 16px; min-width: 0; }
h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2 .direita { margin-left: auto; display: flex; gap: 8px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { border: 1px solid var(--borda); background: var(--superficie); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { width: 100%; border: 1px solid var(--borda); background: var(--fundo); border-radius: 8px; padding: 7px 9px; }
textarea { resize: vertical; min-height: 64px; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--texto-2); }
.regras { display: grid; gap: 12px; }
.regra { border: 1px solid var(--borda); border-radius: var(--raio); padding: 12px; display: grid; gap: 10px; }
.regra.parada { opacity: .7; }
.linha { display: grid; grid-template-columns: 1.4fr 1fr 1.2fr auto; gap: 10px; align-items: end; }
.linha.tres { grid-template-columns: 1fr 1fr 1fr; }
.root { font-size: 12px; color: var(--erro); }
.linha label.marca { display: flex; align-items: center; gap: 6px; white-space: nowrap; padding-bottom: 8px; }
.linha label.marca input { width: auto; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.acoes .resultado { font-size: 13px; color: var(--texto-2); }
.tabela { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grade); white-space: nowrap; }
th { color: var(--texto-2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.texto { white-space: normal; min-width: 260px; max-width: 520px; }
td.texto details summary { cursor: pointer; color: var(--texto-2); }
td.texto pre { white-space: pre-wrap; margin: 6px 0 0; font: inherit; color: var(--texto); }
.estado { display: inline-flex; align-items: center; gap: 4px; }
.estado.ok { color: var(--ok); } .estado.erro { color: var(--erro); }
.grafico { position: relative; }
.grafico svg { width: 100%; height: 180px; display: block; }
.legenda { display: flex; gap: 14px; font-size: 12px; color: var(--texto-2); margin-top: 6px; }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.dica { position: absolute; pointer-events: none; background: var(--texto); color: var(--superficie); font-size: 12px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); display: none; }
.vazio { color: var(--texto-3); font-size: 14px; }
.aviso { padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--erro) 12%, transparent); color: var(--erro); display: none; }
@media (max-width: 720px) { .linha, .linha.tres { grid-template-columns: 1fr 1fr; } .linha label.nome { grid-column: 1 / -1; } }

/* abas do topo */
.abas { display: flex; gap: 4px; }
.abas button { border: 0; background: transparent; color: var(--texto-2); padding: 6px 10px; border-radius: 8px; }
.abas button[aria-selected="true"] { background: var(--fundo); color: var(--texto); font-weight: 600; }
[hidden] { display: none !important; }

/* projetos: os seis chats abertos, 3 em cima e 3 embaixo (Pedro/Tel, 20/10: "não quero ter que abrir") */
main.largo { max-width: 1680px; padding: 10px; gap: 10px; }
.grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.caixa { padding: 0; display: flex; flex-direction: column; height: calc((100vh - 96px) / 2); min-height: 330px; overflow: hidden; }
.caixa > .msgs { flex: 1; min-height: 0; }
.caixa.ampliada { position: fixed; inset: 64px 12px 12px; height: auto; z-index: 5; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
.caixa { border-top: 3px solid var(--cor, var(--borda)); }
.caixa-topo { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--borda); }
.caixa-topo b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.robo { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--cor, var(--texto-3)); color: #fff; }
.robo svg { width: 18px; height: 18px; }
.caixa .compor button.primario { background: var(--cor, var(--azul)); border-color: var(--cor, var(--azul)); }
.caixa-topo select { width: auto; max-width: 42%; font-size: 12px; padding: 4px 6px; }
.caixa-topo button { padding: 3px 8px; font-size: 13px; }
.ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--borda); flex: none; }
.ponto.vivo { background: var(--azul); animation: pisca 1s infinite alternate; }
@keyframes pisca { to { opacity: .3; } }
.barra-nay { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--texto-2); padding: 6px 10px; border-bottom: 1px solid var(--borda); }
.barra-nay select { width: auto; font-size: 12px; padding: 3px 5px; }
.barra-nay button { padding: 3px 8px; font-size: 12px; }
.msgs { overflow-y: auto; padding: 12px; display: grid; gap: 12px; align-content: start; font-size: 14px; }
.msg { max-width: 94%; }
.msg.voce { justify-self: end; background: var(--fundo); border: 1px solid var(--borda); border-radius: 14px; padding: 9px 13px; white-space: pre-wrap; }
.msg.claude { justify-self: start; width: 100%; }
.msg .meta { font-size: 11px; color: var(--texto-3); margin-top: 4px; }
.msg.claude .corpo { line-height: 1.55; overflow-x: auto; }
.msg.claude .corpo table { font-size: 13px; margin: 8px 0; }
.msg.claude .corpo td, .msg.claude .corpo th { white-space: normal; border: 1px solid var(--grade); }
.msg.claude .corpo pre { background: var(--fundo); padding: 10px; border-radius: 8px; overflow-x: auto; }
.msg.claude .corpo code { font-size: 13px; }
.msg.erro .corpo { color: var(--erro); white-space: pre-wrap; }
.pensando { color: var(--texto-2); font-size: 14px; }
.compor { border-top: 1px solid var(--borda); padding: 8px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: end; }
.compor textarea { min-height: 40px; max-height: 30vh; resize: none; font-size: 14px; padding: 6px 8px; }
.compor button { padding: 8px 12px; }
.anexo { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--grade); }
.anexo span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
dialog { border: 1px solid var(--borda); border-radius: var(--raio); background: var(--superficie); color: var(--texto); padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(0,0,0,.45); }
.dlg-topo { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--borda); position: sticky; top: 0; background: var(--superficie); }
.dlg-topo b { flex: 1; }
.dlg-abas { display: flex; gap: 4px; padding: 8px 14px 0; }
.dlg-abas button { border: 0; background: transparent; color: var(--texto-2); }
.dlg-abas button[aria-selected="true"] { background: var(--fundo); color: var(--texto); font-weight: 600; }
.dlg-corpo { padding: 14px; display: grid; gap: 10px; }
.rodape-p { display: flex; justify-content: flex-end; }
@media (max-width: 1100px) { .grade { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .grade { grid-template-columns: 1fr; } .caixa { height: 75vh; } }
</style>
</head>
<body>
<header>
  <h1>Agente Claude</h1>
  <nav class="abas" role="tablist">
    <button type="button" role="tab" data-aba="projetos" aria-selected="true">Projetos</button>
    <button type="button" role="tab" data-aba="regras" aria-selected="false">Regras e métricas</button>
  </nav>
  <a href="https://imobeasy.online/admin/inicio.html">← Admin</a>
</header>

<main id="vista-projetos" class="largo">
  <div class="aviso" id="aviso-p"></div>
  <div class="grade" id="p-grade"></div>
  <div class="rodape-p"><button id="p-novo">+ Projeto</button></div>
</main>
<dialog id="p-dialogo">
  <div class="dlg-topo"><b id="dlg-titulo"></b><button id="dlg-fechar" type="button">Fechar</button></div>
  <div class="dlg-abas" id="dlg-abas"></div>
  <div class="dlg-corpo" id="dlg-corpo"></div>
</dialog>

<main id="vista-regras" hidden>
  <div class="aviso" id="aviso"></div>

  <section>
    <h2>Regras <span class="direita"><button id="nova">+ Regra</button><button class="primario" id="salvar">Salvar regras</button></span></h2>
    <div class="regras" id="regras"></div>
  </section>

  <section>
    <h2>Tempo de cada disparo <span class="direita" style="font-weight:400;font-size:13px;color:var(--texto-2)">últimos 40, em segundos</span></h2>
    <div class="grafico" id="grafico"></div>
  </section>

  <section>
    <h2>Métricas por regra
      <span class="direita"><select id="dias" style="width:auto">
        <option value="1">hoje e ontem</option><option value="7" selected>7 dias</option><option value="30">30 dias</option><option value="365">1 ano</option>
      </select></span></h2>
    <div class="tabela" id="metricas"></div>
  </section>

  <section>
    <h2>Últimos disparos</h2>
    <div class="tabela" id="ultimas"></div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var MODELOS = ["haiku", "sonnet", "opus"];
  var ESFORCOS = ["", "low", "medium", "high"];
  var SERVIDORES = [["vps2", "VPS2 (Hermes, agentes)"], ["vps1", "VPS1 (Nay, site, CRM)"]];
  var MODOS = [["responder", "Só responder"], ["alterar", "Fazer alterações (root)"]];
  var regras = {}, padrao = {}, limites = {}, rodando = [], ultimas = [], sujo = false, espera = null;

  function el(tag, attrs, filhos) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "texto") e.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    });
    (filhos || []).forEach(function (f) { if (f) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return e;
  }
  function aviso(msg) { var a = document.getElementById("aviso"); a.textContent = msg || ""; a.style.display = msg ? "block" : "none"; }
  function api(metodo, caminho, corpo) {
    return fetch(caminho, {
      method: metodo, credentials: "same-origin",
      headers: corpo ? { "Content-Type": "application/json", "X-Agente": "1" } : {},
      body: corpo ? JSON.stringify(corpo) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.erro || ("erro " + r.status));
        return j;
      });
    });
  }
  function num(v) { return v == null ? "—" : Number(v).toLocaleString("pt-BR"); }
  function seg(ms) { return ms == null ? "—" : (ms / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " s"; }

  /* ---- regras ---- */
  function desenharRegras() {
    var caixa = document.getElementById("regras");
    caixa.textContent = "";
    var nomes = Object.keys(regras);
    if (!nomes.length) caixa.appendChild(el("p", { class: "vazio", texto: "Nenhuma regra. Clique em + Regra." }));
    nomes.forEach(function (nome) {
      var r = regras[nome], ativa = r.ativa !== false;
      function campo(k, v) { if (v === "" || v == null) delete r[k]; else r[k] = v; sujo = true; }
      var resultado = el("span", { class: "resultado" });
      var nomeInput = el("input", { value: nome, onchange: function () {
        var novo = this.value.trim();
        if (!novo || novo === nome) { this.value = nome; return; }
        if (regras[novo]) { aviso("Já existe uma regra " + novo); this.value = nome; return; }
        var copia = {}; Object.keys(regras).forEach(function (k) { copia[k === nome ? novo : k] = regras[k]; });
        regras = copia; sujo = true; desenharRegras();
      } });
      var modelo = el("input", { value: r.modelo || "", placeholder: padrao.modelo, list: "modelos", onchange: function () { campo("modelo", this.value.trim()); } });
      var esforco = el("select", { onchange: function () { campo("esforco", this.value); } },
        ESFORCOS.map(function (e) { return el("option", { value: e, selected: (r.esforco || "") === e, texto: e || "padrão" }); }));
      var modo = r.modo || padrao.modo;
      var timeout = el("input", { type: "number", min: 10, value: r.timeout_s || "", placeholder: limites[modo], onchange: function () { campo("timeout_s", this.value ? parseInt(this.value, 10) : ""); } });
      var marca = el("input", { type: "checkbox", checked: ativa, onchange: function () { r.ativa = this.checked; sujo = true; desenharRegras(); } });
      function opcoes(lista, atual) { return lista.map(function (o) { return el("option", { value: o[0], selected: atual === o[0], texto: o[1] }); }); }
      var servidor = el("select", { onchange: function () { campo("servidor", this.value); } }, opcoes(SERVIDORES, r.servidor || padrao.servidor));
      var modoSel = el("select", { onchange: function () { campo("modo", this.value); desenharRegras(); } }, opcoes(MODOS, modo));
      var correndo = rodando.some(function (x) { return x.regras.indexOf(nome) >= 0; });
      var ultima = ultimas.filter(function (u) { return u.regra === nome; })[0];
      if (correndo) resultado.textContent = "rodando…";
      else if (ultima) resultado.textContent = "última: " + (ultima.ok ? "ok" : "erro") + " em " + seg(ultima.ms_total) + " · " + ultima.inicio.slice(5, 16).replace("-", "/");
      var disparar = el("button", { class: "primario", disabled: !ativa || correndo, title: ativa ? "" : "Regra parada", onclick: function () {
        if (sujo) { aviso("Salve as regras antes de disparar."); return; }
        disparar.disabled = true; resultado.textContent = "rodando…";
        api("POST", "/api/disparar", { regras: [nome] }).then(function () { carregar(); })
          .catch(function (e) { resultado.textContent = e.message; disparar.disabled = false; });
      } }, ["Disparar"]);
      caixa.appendChild(el("div", { class: "regra" + (ativa ? "" : " parada") }, [
        el("div", { class: "linha" }, [
          el("label", { class: "nome" }, ["Nome", nomeInput]),
          el("label", {}, ["Servidor", servidor]),
          el("label", {}, ["Modo", modoSel]),
          el("label", { class: "marca" }, [marca, "Ativa"])
        ]),
        modo === "alterar" ? el("div", { class: "root", texto: "Esta ordem mexe no servidor como root: o Claude roda comandos e edita arquivos sozinho." }) : null,
        el("div", { class: "linha tres" }, [
          el("label", {}, ["Modelo", modelo]),
          el("label", {}, ["Esforço", esforco]),
          el("label", {}, ["Limite (s)", timeout])
        ]),
        el("div", { class: "linha tres" }, [
          el("label", {}, ["Horário (Brasília; vazio = só na mão)", el("input", { type: "time", value: r.horario || "", onchange: function () { campo("horario", this.value); } })]),
          el("label", {}, ["Dias", el("select", { onchange: function () { campo("dias", this.value); } },
            [["todos", "todo dia"], ["seg-sex", "segunda a sexta"], ["seg-sab", "segunda a sábado"]].map(function (o) { return el("option", { value: o[0], selected: (r.dias || "todos") === o[0], texto: o[1] }); }))]),
          el("span", {})
        ]),
        el("label", {}, ["Mensagem", el("textarea", { rows: 3, oninput: function () { campo("mensagem", this.value); } }, [r.mensagem || ""])]),
        el("label", {}, ["Instrução fixa (opcional)", el("textarea", { rows: 2, oninput: function () { campo("sistema", this.value); } }, [r.sistema || ""])]),
        el("div", { class: "acoes" }, [
          disparar,
          el("button", { onclick: function () {
            if (!confirm("Apagar a regra " + nome + "? (só some de vez ao salvar)")) return;
            delete regras[nome]; sujo = true; desenharRegras();
          } }, ["Apagar"]),
          resultado
        ])
      ]));
    });
  }
  document.getElementById("nova").addEventListener("click", function () {
    var n = 1; while (regras["regra-" + n]) n++;
    regras["regra-" + n] = { mensagem: "", ativa: true }; sujo = true; desenharRegras();
  });
  document.getElementById("salvar").addEventListener("click", function () {
    var b = this; b.disabled = true; aviso("");
    api("PUT", "/api/regras", regras).then(function (j) {
      regras = j.regras; sujo = false; desenharRegras(); b.textContent = "Salvo ✓";
      setTimeout(function () { b.textContent = "Salvar regras"; }, 1500);
    }).catch(function (e) { aviso(e.message); }).then(function () { b.disabled = false; });
  });

  /* ---- gráfico: tempo de cada disparo (uma série; erro em vermelho com ✕) ---- */
  function desenharGrafico(ultimas) {
    var caixa = document.getElementById("grafico");
    caixa.textContent = "";
    var dados = ultimas.slice().reverse();
    if (!dados.length) { caixa.appendChild(el("p", { class: "vazio", texto: "Nenhum disparo ainda." })); return; }
    var W = 1000, H = 180, esq = 40, base = H - 20, topo = 10;
    var max = Math.max.apply(null, dados.map(function (d) { return d.ms_total || 0; })) || 1;
    var passo = Math.pow(10, Math.floor(Math.log10(max / 1000 / 3 || 1)));
    var marca = [1, 2, 5, 10].map(function (m) { return m * passo; }).filter(function (m) { return max / 1000 / m <= 4; })[0] || passo * 10;
    var topoS = Math.ceil(max / 1000 / marca) * marca;
    function y(ms) { return base - (ms / 1000 / topoS) * (base - topo); }
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Tempo de cada disparo, em segundos");
    function s(tag, a) { var e = document.createElementNS(ns, tag); Object.keys(a).forEach(function (k) { e.setAttribute(k, a[k]); }); svg.appendChild(e); return e; }
    for (var v = 0; v <= topoS + 1e-9; v += marca) {
      s("line", { x1: esq, x2: W, y1: y(v * 1000), y2: y(v * 1000), stroke: "var(--grade)", "stroke-width": 1, "vector-effect": "non-scaling-stroke" });
      var t = s("text", { x: esq - 6, y: y(v * 1000) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--texto-3)" });
      t.textContent = v.toLocaleString("pt-BR");
    }
    var larg = (W - esq) / Math.max(dados.length, 10), barra = Math.max(2, Math.min(larg - 2, 28));
    var dica = el("div", { class: "dica" });
    dados.forEach(function (d, i) {
      var x = esq + i * larg + (larg - barra) / 2, h = Math.max(2, base - y(d.ms_total || 0));
      var rx = Math.min(4, barra / 2);
      s("path", {
        d: "M" + x + "," + base + "V" + (base - h + rx) + "q0,-" + rx + " " + rx + ",-" + rx + "h" + (barra - 2 * rx) + "q" + rx + ",0 " + rx + "," + rx + "V" + base + "Z",
        fill: d.ok ? "var(--azul)" : "var(--erro)"
      });

    b.appendChild(el("label", {}, ["Mensagem", msg]));
    b.appendChild(el("div", { class: "acoes" }, [
      el("button", { type: "button", class: "primario", onclick: function () { salvar(c, { agenda: { horario: hora.value, dias: dias.value, mensagem: msg.value } }, ok); } }, ["Salvar"]),
      el("button", { type: "button", onclick: function () { hora.value = ""; msg.value = ""; salvar(c, { agenda: null }, ok); } }, ["Tirar o horário"]), ok]));
  }

  function abaAnexos(c) {
    var b = corpo();
    var entrada = el("input", { type: "file", multiple: true, accept: ".txt,.md,.csv,.tsv,.json,.jsonl,.pdf,.png,.jpg,.jpeg,.xlsx" });
    var estado = el("span", { class: "pensando" });
    entrada.addEventListener("change", function () {
      var arqs = [].slice.call(entrada.files), feitos = 0;
      if (!arqs.length) return;
      estado.textContent = "enviando…";
      arqs.reduce(function (p, f) {
        return p.then(function () {
          return api("POST", "/api/projetos/" + c.pid + "/anexos?nome=" + encodeURIComponent(f.name), f, true).then(function (j) {
            feitos++; estado.textContent = feitos + " de " + arqs.length + (j.gerados && j.gerados.length ? " · virou " + j.gerados.join(", ") : "");
            c.detalhe.anexos = j.anexos;
          });
        });
      }, Promise.resolve()).then(function () { lista(); }).catch(function (e) { estado.textContent = e.message; });
    });
    var caixaLista = el("div", {});
    function lista() {
      caixaLista.textContent = "";
      if (!c.detalhe.anexos.length) caixaLista.appendChild(el("p", { class: "vazio", texto: "Nenhum anexo. Aceita .txt, .md, .csv, .tsv, .json, .pdf, imagem e .xlsx (a planilha vira um .csv por aba)." }));
      c.detalhe.anexos.forEach(function (a) {
        caixaLista.appendChild(el("div", { class: "anexo" }, [el("span", { texto: a.nome, title: a.nome }), el("small", { texto: kb(a.bytes) + " · " + quando(a.em) }),
          el("button", { type: "button", onclick: function () {
            if (!confirm("Apagar " + a.nome + "?")) return;
            api("DELETE", "/api/projetos/" + c.pid + "/anexos?nome=" + encodeURIComponent(a.nome)).then(function (j) { c.detalhe.anexos = j.anexos; lista(); })
              .catch(function (e) { estado.textContent = e.message; });
          } }, ["Apagar"])]));
      });
    }
    b.appendChild(el("p", { class: "vazio", texto: "O Claude deste projeto lê estes arquivos quando a pergunta precisar." }));
    b.appendChild(el("div", { class: "acoes" }, [entrada, estado]));
    b.appendChild(caixaLista);
    lista();
  }

  $("p-novo").addEventListener("click", function () {
    var nome = prompt("Nome do projeto novo:"); if (!nome) return;
    var id = nome.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
    api("POST", "/api/projetos", { id: id, nome: nome, contexto: "# Contexto: " + nome + "\n\n(escreva aqui quem você é, o objetivo e como o Claude deve agir)\n" })
      .then(montar).catch(function (e) { aviso(e.message); });
  });

  montar();
})();
</script>
</body>
</html>
