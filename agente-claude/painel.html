<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente Claude</title>
<style>
:root {
  --fundo: #f4f4f2; --superficie: #fcfcfb; --borda: #e2e1dc; --texto: #0b0b0b; --texto-2: #52514e; --texto-3: #8a8983;
  --azul: #2a78d6; --azul-forte: #1c5cab; --erro: #d03b3b; --ok: #0ca30c; --grade: #ecebe7; --raio: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fundo: #111110; --superficie: #1a1a19; --borda: #2e2e2b; --texto: #f0efec; --texto-2: #c3c2b7; --texto-3: #8f8e86;
    --azul: #3987e5; --azul-forte: #6da7ec; --erro: #e66767; --ok: #2fbf2f; --grade: #262624;
  }
}
:root[data-theme="dark"] {
  --fundo: #111110; --superficie: #1a1a19; --borda: #2e2e2b; --texto: #f0efec; --texto-2: #c3c2b7; --texto-3: #8f8e86;
  --azul: #3987e5; --azul-forte: #6da7ec; --erro: #e66767; --ok: #2fbf2f; --grade: #262624;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--fundo); color: var(--texto); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--borda); background: var(--superficie); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 17px; margin: 0; flex: 1; }
header a { color: var(--texto-2); text-decoration: none; font-size: 14px; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
section { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio); padding: 16px; min-width: 0; }
h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2 .direita { margin-left: auto; display: flex; gap: 8px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { border: 1px solid var(--borda); background: var(--superficie); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button.primario { background: var(--azul); border-color: var(--azul); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
input, select, textarea { width: 100%; border: 1px solid var(--borda); background: var(--fundo); border-radius: 8px; padding: 7px 9px; }
textarea { resize: vertical; min-height: 64px; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--texto-2); }
.regras { display: grid; gap: 12px; }
.regra { border: 1px solid var(--borda); border-radius: var(--raio); padding: 12px; display: grid; gap: 10px; }
.regra.parada { opacity: .7; }
.linha { display: grid; grid-template-columns: 1.4fr 1fr 1.2fr auto; gap: 10px; align-items: end; }
.linha.tres { grid-template-columns: 1fr 1fr 1fr; }
.root { font-size: 12px; color: var(--erro); }
.linha label.marca { display: flex; align-items: center; gap: 6px; white-space: nowrap; padding-bottom: 8px; }
.linha label.marca input { width: auto; }
.acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.acoes .resultado { font-size: 13px; color: var(--texto-2); }
.tabela { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grade); white-space: nowrap; }
th { color: var(--texto-2); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.texto { white-space: normal; min-width: 260px; max-width: 520px; }
td.texto details summary { cursor: pointer; color: var(--texto-2); }
td.texto pre { white-space: pre-wrap; margin: 6px 0 0; font: inherit; color: var(--texto); }
.estado { display: inline-flex; align-items: center; gap: 4px; }
.estado.ok { color: var(--ok); } .estado.erro { color: var(--erro); }
.grafico { position: relative; }
.grafico svg { width: 100%; height: 180px; display: block; }
.legenda { display: flex; gap: 14px; font-size: 12px; color: var(--texto-2); margin-top: 6px; }
.legenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.dica { position: absolute; pointer-events: none; background: var(--texto); color: var(--superficie); font-size: 12px; padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); display: none; }
.vazio { color: var(--texto-3); font-size: 14px; }
.aviso { padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--erro) 12%, transparent); color: var(--erro); display: none; }
@media (max-width: 720px) { .linha, .linha.tres { grid-template-columns: 1fr 1fr; } .linha label.nome { grid-column: 1 / -1; } }

/* abas do topo */
.abas { display: flex; gap: 4px; }
.abas button { border: 0; background: transparent; color: var(--texto-2); padding: 6px 10px; border-radius: 8px; }
.abas button[aria-selected="true"] { background: var(--fundo); color: var(--texto); font-weight: 600; }
[hidden] { display: none !important; }

/* projetos: os quadrados */
.quadros { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.quadro { text-align: left; display: grid; gap: 6px; align-content: start; padding: 14px; min-height: 150px; border-radius: var(--raio); border: 1px solid var(--borda); background: var(--superficie); }
.quadro:hover { border-color: var(--azul); }
.quadro b { font-size: 15px; }
.quadro .desc { font-size: 13px; color: var(--texto-2); }
.quadro .rodape { font-size: 12px; color: var(--texto-3); margin-top: auto; }

/* projetos: o chat */
.proj { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 12px; min-height: calc(100vh - 150px); }
.proj-topo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.proj-topo h2 { margin: 0; flex: 1; }
.lista-conv { display: grid; gap: 4px; align-content: start; }
.lista-conv button { text-align: left; border: 0; background: transparent; padding: 8px 10px; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lista-conv button[aria-current="true"] { background: var(--fundo); font-weight: 600; }
.lista-conv button.primario { background: var(--azul); color: #fff; }
.chat { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 60vh; padding: 0; }
.msgs { overflow-y: auto; padding: 16px; display: grid; gap: 14px; align-content: start; max-height: calc(100vh - 260px); }
.msg { max-width: 92%; }
.msg.voce { justify-self: end; background: var(--fundo); border: 1px solid var(--borda); border-radius: 14px; padding: 9px 13px; white-space: pre-wrap; }
.msg.claude { justify-self: start; width: 100%; }
.msg .meta { font-size: 11px; color: var(--texto-3); margin-top: 4px; }
.msg.claude .corpo { line-height: 1.55; overflow-x: auto; }
.msg.claude .corpo table { font-size: 13px; margin: 8px 0; }
.msg.claude .corpo td, .msg.claude .corpo th { white-space: normal; border: 1px solid var(--grade); }
.msg.claude .corpo pre { background: var(--fundo); padding: 10px; border-radius: 8px; overflow-x: auto; }
.msg.claude .corpo code { font-size: 13px; }
.msg.erro .corpo { color: var(--erro); white-space: pre-wrap; }
.pensando { color: var(--texto-2); font-size: 14px; }
.compor { border-top: 1px solid var(--borda); padding: 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
.compor textarea { min-height: 48px; max-height: 40vh; resize: none; }
.gaveta { display: grid; gap: 10px; }
.anexo { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--grade); }
.anexo span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.importa { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--texto-2); }
.importa select { width: auto; }
@media (max-width: 720px) {
  .proj { grid-template-columns: 1fr; min-height: 0; align-content: start; }
  .lista-conv { grid-auto-flow: column; grid-auto-columns: minmax(140px, 1fr); overflow-x: auto; }
  .msgs { max-height: none; }
}
</style>
</head>
<body>
<header>
  <h1>Agente Claude</h1>
  <nav class="abas" role="tablist">
    <button type="button" role="tab" data-aba="projetos" aria-selected="true">Projetos</button>
    <button type="button" role="tab" data-aba="regras" aria-selected="false">Regras e métricas</button>
  </nav>
  <a href="https://imobeasy.online/admin/inicio.html">← Admin</a>
</header>

<main id="vista-projetos">
  <div class="aviso" id="aviso-p"></div>
  <div id="p-inicio">
    <section>
      <h2>Projetos <span class="direita"><button id="p-novo">+ Projeto</button></span></h2>
      <div class="quadros" id="p-quadros"></div>
    </section>
  </div>
  <div id="p-aberto" hidden>
    <section class="proj-topo">
      <button id="p-voltar">← Projetos</button>
      <h2 id="p-nome"></h2>
      <button id="p-bt-anexos">Anexos</button>
      <button id="p-bt-contexto">Contexto e modelo</button>
    </section>
    <section id="p-importa" class="importa" hidden></section>
    <section id="p-anexos" class="gaveta" hidden></section>
    <section id="p-contexto" class="gaveta" hidden></section>
    <div class="proj">
      <section class="lista-conv" id="p-conversas"></section>
      <section class="chat">
        <div class="msgs" id="p-msgs"></div>
        <form class="compor" id="p-compor">
          <textarea id="p-texto" rows="2" placeholder="Escreva aqui. Enter envia, Shift+Enter pula linha."></textarea>
          <button class="primario" id="p-enviar" type="submit">Enviar</button>
        </form>
      </section>
    </div>
  </div>
</main>

<main id="vista-regras" hidden>
  <div class="aviso" id="aviso"></div>

  <section>
    <h2>Regras <span class="direita"><button id="nova">+ Regra</button><button class="primario" id="salvar">Salvar regras</button></span></h2>
    <div class="regras" id="regras"></div>
  </section>

  <section>
    <h2>Tempo de cada disparo <span class="direita" style="font-weight:400;font-size:13px;color:var(--texto-2)">últimos 40, em segundos</span></h2>
    <div class="grafico" id="grafico"></div>
  </section>

  <section>
    <h2>Métricas por regra
      <span class="direita"><select id="dias" style="width:auto">
        <option value="1">hoje e ontem</option><option value="7" selected>7 dias</option><option value="30">30 dias</option><option value="365">1 ano</option>
      </select></span></h2>
    <div class="tabela" id="metricas"></div>
  </section>

  <section>
    <h2>Últimos disparos</h2>
    <div class="tabela" id="ultimas"></div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var MODELOS = ["haiku", "sonnet", "opus"];
  var ESFORCOS = ["", "low", "medium", "high"];
  var SERVIDORES = [["vps2", "VPS2 (Hermes, agentes)"], ["vps1", "VPS1 (Nay, site, CRM)"]];
  var MODOS = [["responder", "Só responder"], ["alterar", "Fazer alterações (root)"]];
  var regras = {}, padrao = {}, limites = {}, rodando = [], ultimas = [], sujo = false, espera = null;

  function el(tag, attrs, filhos) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "texto") e.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    });
    (filhos || []).forEach(function (f) { if (f) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return e;
  }
  function aviso(msg) { var a = document.getElementById("aviso"); a.textContent = msg || ""; a.style.display = msg ? "block" : "none"; }
  function api(metodo, caminho, corpo) {
    return fetch(caminho, {
      method: metodo, credentials: "same-origin",
      headers: corpo ? { "Content-Type": "application/json", "X-Agente": "1" } : {},
      body: corpo ? JSON.stringify(corpo) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.erro || ("erro " + r.status));
        return j;
      });
    });
  }
  function num(v) { return v == null ? "—" : Number(v).toLocaleString("pt-BR"); }
  function seg(ms) { return ms == null ? "—" : (ms / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " s"; }

  /* ---- regras ---- */
  function desenharRegras() {
    var caixa = document.getElementById("regras");
    caixa.textContent = "";
    var nomes = Object.keys(regras);
    if (!nomes.length) caixa.appendChild(el("p", { class: "vazio", texto: "Nenhuma regra. Clique em + Regra." }));
    nomes.forEach(function (nome) {
      var r = regras[nome], ativa = r.ativa !== false;
      function campo(k, v) { if (v === "" || v == null) delete r[k]; else r[k] = v; sujo = true; }
      var resultado = el("span", { class: "resultado" });
      var nomeInput = el("input", { value: nome, onchange: function () {
        var novo = this.value.trim();
        if (!novo || novo === nome) { this.value = nome; return; }
        if (regras[novo]) { aviso("Já existe uma regra " + novo); this.value = nome; return; }
        var copia = {}; Object.keys(regras).forEach(function (k) { copia[k === nome ? novo : k] = regras[k]; });
        regras = copia; sujo = true; desenharRegras();
      } });
      var modelo = el("input", { value: r.modelo || "", placeholder: padrao.modelo, list: "modelos", onchange: function () { campo("modelo", this.value.trim()); } });
      var esforco = el("select", { onchange: function () { campo("esforco", this.value); } },
        ESFORCOS.map(function (e) { return el("option", { value: e, selected: (r.esforco || "") === e, texto: e || "padrão" }); }));
      var modo = r.modo || padrao.modo;
      var timeout = el("input", { type: "number", min: 10, value: r.timeout_s || "", placeholder: limites[modo], onchange: function () { campo("timeout_s", this.value ? parseInt(this.value, 10) : ""); } });
      var marca = el("input", { type: "checkbox", checked: ativa, onchange: function () { r.ativa = this.checked; sujo = true; desenharRegras(); } });
      function opcoes(lista, atual) { return lista.map(function (o) { return el("option", { value: o[0], selected: atual === o[0], texto: o[1] }); }); }
      var servidor = el("select", { onchange: function () { campo("servidor", this.value); } }, opcoes(SERVIDORES, r.servidor || padrao.servidor));
      var modoSel = el("select", { onchange: function () { campo("modo", this.value); desenharRegras(); } }, opcoes(MODOS, modo));
      var correndo = rodando.some(function (x) { return x.regras.indexOf(nome) >= 0; });
      var ultima = ultimas.filter(function (u) { return u.regra === nome; })[0];
      if (correndo) resultado.textContent = "rodando…";
      else if (ultima) resultado.textContent = "última: " + (ultima.ok ? "ok" : "erro") + " em " + seg(ultima.ms_total) + " · " + ultima.inicio.slice(5, 16).replace("-", "/");
      var disparar = el("button", { class: "primario", disabled: !ativa || correndo, title: ativa ? "" : "Regra parada", onclick: function () {
        if (sujo) { aviso("Salve as regras antes de disparar."); return; }
        disparar.disabled = true; resultado.textContent = "rodando…";
        api("POST", "/api/disparar", { regras: [nome] }).then(function () { carregar(); })
          .catch(function (e) { resultado.textContent = e.message; disparar.disabled = false; });
      } }, ["Disparar"]);
      caixa.appendChild(el("div", { class: "regra" + (ativa ? "" : " parada") }, [
        el("div", { class: "linha" }, [
          el("label", { class: "nome" }, ["Nome", nomeInput]),
          el("label", {}, ["Servidor", servidor]),
          el("label", {}, ["Modo", modoSel]),
          el("label", { class: "marca" }, [marca, "Ativa"])
        ]),
        modo === "alterar" ? el("div", { class: "root", texto: "Esta ordem mexe no servidor como root: o Claude roda comandos e edita arquivos sozinho." }) : null,
        el("div", { class: "linha tres" }, [
          el("label", {}, ["Modelo", modelo]),
          el("label", {}, ["Esforço", esforco]),
          el("label", {}, ["Limite (s)", timeout])
        ]),
        el("label", {}, ["Mensagem", el("textarea", { rows: 3, oninput: function () { campo("mensagem", this.value); } }, [r.mensagem || ""])]),
        el("label", {}, ["Instrução fixa (opcional)", el("textarea", { rows: 2, oninput: function () { campo("sistema", this.value); } }, [r.sistema || ""])]),
        el("div", { class: "acoes" }, [
          disparar,
          el("button", { onclick: function () {
            if (!confirm("Apagar a regra " + nome + "? (só some de vez ao salvar)")) return;
            delete regras[nome]; sujo = true; desenharRegras();
          } }, ["Apagar"]),
          resultado
        ])
      ]));
    });
  }
  document.getElementById("nova").addEventListener("click", function () {
    var n = 1; while (regras["regra-" + n]) n++;
    regras["regra-" + n] = { mensagem: "", ativa: true }; sujo = true; desenharRegras();
  });
  document.getElementById("salvar").addEventListener("click", function () {
    var b = this; b.disabled = true; aviso("");
    api("PUT", "/api/regras", regras).then(function (j) {
      regras = j.regras; sujo = false; desenharRegras(); b.textContent = "Salvo ✓";
      setTimeout(function () { b.textContent = "Salvar regras"; }, 1500);
    }).catch(function (e) { aviso(e.message); }).then(function () { b.disabled = false; });
  });

  /* ---- gráfico: tempo de cada disparo (uma série; erro em vermelho com ✕) ---- */
  function desenharGrafico(ultimas) {
    var caixa = document.getElementById("grafico");
    caixa.textContent = "";
    var dados = ultimas.slice().reverse();
    if (!dados.length) { caixa.appendChild(el("p", { class: "vazio", texto: "Nenhum disparo ainda." })); return; }
    var W = 1000, H = 180, esq = 40, base = H - 20, topo = 10;
    var max = Math.max.apply(null, dados.map(function (d) { return d.ms_total || 0; })) || 1;
    var passo = Math.pow(10, Math.floor(Math.log10(max / 1000 / 3 || 1)));
    var marca = [1, 2, 5, 10].map(function (m) { return m * passo; }).filter(function (m) { return max / 1000 / m <= 4; })[0] || passo * 10;
    var topoS = Math.ceil(max / 1000 / marca) * marca;
    function y(ms) { return base - (ms / 1000 / topoS) * (base - topo); }
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "Tempo de cada disparo, em segundos");
    function s(tag, a) { var e = document.createElementNS(ns, tag); Object.keys(a).forEach(function (k) { e.setAttribute(k, a[k]); }); svg.appendChild(e); return e; }
    for (var v = 0; v <= topoS + 1e-9; v += marca) {
      s("line", { x1: esq, x2: W, y1: y(v * 1000), y2: y(v * 1000), stroke: "var(--grade)", "stroke-width": 1, "vector-effect": "non-scaling-stroke" });
      var t = s("text", { x: esq - 6, y: y(v * 1000) + 4, "text-anchor": "end", "font-size": 11, fill: "var(--texto-3)" });
      t.textContent = v.toLocaleString("pt-BR");
    }
    var larg = (W - esq) / Math.max(dados.length, 10), barra = Math.max(2, Math.min(larg - 2, 28));
    var dica = el("div", { class: "dica" });
    dados.forEach(function (d, i) {
      var x = esq + i * larg + (larg - barra) / 2, h = Math.max(2, base - y(d.ms_total || 0));
      var rx = Math.min(4, barra / 2);
      s("path", {
        d: "M" + x + "," + base + "V" + (base - h + rx) + "q0,-" + rx + " " + rx + ",-" + rx + "h" + (barra - 2 * rx) + "q" + rx + ",0 " + rx + "," + rx + "V" + base + "Z",
        fill: d.ok ? "var(--azul)" : "var(--erro)"
      });
      if (!d.ok) { var xx = s("text", { x: x + barra / 2, y: base - h - 4, "text-anchor": "middle", "font-size": 11, fill: "var(--erro)" }); xx.textContent = "✕"; }
      var alvo = s("rect", { x: esq + i * larg, y: topo, width: larg, height: base - topo, fill: "transparent" });
      alvo.addEventListener("mouseenter", function () {
        dica.textContent = d.regra + " · " + seg(d.ms_total) + (d.ok ? "" : " · erro") + " · " + d.inicio.slice(5, 16).replace("-", "/");
        var caixaR = caixa.getBoundingClientRect(), r = alvo.getBoundingClientRect();
        dica.style.left = (r.left - caixaR.left + r.width / 2) + "px";
        dica.style.top = (r.top - caixaR.top + (y(d.ms_total || 0) / H) * r.height) + "px";
        dica.style.display = "block";
      });
      alvo.addEventListener("mouseleave", function () { dica.style.display = "none"; });
    });
    s("line", { x1: esq, x2: W, y1: base, y2: base, stroke: "var(--borda)", "stroke-width": 1, "vector-effect": "non-scaling-stroke" });
    caixa.appendChild(svg); caixa.appendChild(dica);
    caixa.appendChild(el("div", { class: "legenda" }, [
      el("span", {}, [el("i", { style: "background:var(--azul)" }), "ok"]),
      el("span", {}, [el("i", { style: "background:var(--erro)" }), "✕ erro"])
    ]));
  }

  /* ---- tabelas ---- */
  function tabela(colunas, linhas, vazio) {
    if (!linhas.length) return el("p", { class: "vazio", texto: vazio });
    return el("table", {}, [
      el("thead", {}, [el("tr", {}, colunas.map(function (c) { return el("th", { class: c.num ? "num" : "", texto: c.t }); }))]),
      el("tbody", {}, linhas.map(function (l) {
        return el("tr", {}, colunas.map(function (c) {
          var v = c.f(l);
          return el("td", { class: c.num ? "num" : (c.texto ? "texto" : "") }, [typeof v === "string" ? v : v]);
        }));
      }))
    ]);
  }
  function estado(ok) { return el("span", { class: "estado " + (ok ? "ok" : "erro"), texto: ok ? "✓ ok" : "✕ erro" }); }
  function desenharTabelas(j) {
    var m = document.getElementById("metricas"); m.textContent = "";
    m.appendChild(tabela([
      { t: "Regra", f: function (l) { return l.regra; } },
      { t: "Vezes", num: 1, f: function (l) { return num(l.vezes); } },
      { t: "Ok", num: 1, f: function (l) { return num(l.ok); } },
      { t: "Tempo médio", num: 1, f: function (l) { return seg(l.ms_medio); } },
      { t: "Tempo máx.", num: 1, f: function (l) { return seg(l.ms_max); } },
      { t: "Só a API", num: 1, f: function (l) { return seg(l.ms_api_medio); } },
      { t: "Tokens entrada", num: 1, f: function (l) { return num(l.tokens_entrada); } },
      { t: "Tokens saída", num: 1, f: function (l) { return num(l.tokens_saida); } },
      { t: "Cache lido", num: 1, f: function (l) { return num(l.cache_lido); } },
      { t: "US$ equiv.", num: 1, f: function (l) { return l.custo_usd == null ? "—" : "$" + l.custo_usd.toFixed(4); } },
      { t: "Última", f: function (l) { return l.ultima; } }
    ], j.metricas, "Nenhum disparo no período."));
    var u = document.getElementById("ultimas"); u.textContent = "";
    u.appendChild(tabela([
      { t: "Quando", f: function (l) { return l.inicio.slice(5, 16).replace("-", "/"); } },
      { t: "Regra", f: function (l) { return l.regra; } },
      { t: "Onde", f: function (l) { return (l.servidor || "vps2") + (l.modo === "alterar" ? " · alterou" : ""); } },
      { t: "Quem", f: function (l) { return l.origem || "—"; } },
      { t: "", f: function (l) { return estado(l.ok); } },
      { t: "Tempo", num: 1, f: function (l) { return seg(l.ms_total); } },
      { t: "Tokens", num: 1, f: function (l) { return num((l.tokens_entrada || 0) + (l.tokens_saida || 0)); } },
      { t: "Resposta", texto: 1, f: function (l) {
        var t = l.resposta || l.erro || "";
        return el("details", {}, [el("summary", { texto: t.slice(0, 90) + (t.length > 90 ? "…" : "") }), el("pre", { texto: t })]);
      } }
    ], j.ultimas, "Nenhum disparo ainda."));
    desenharGrafico(j.ultimas);
  }

  function carregar(primeira) {
    return api("GET", "/api/estado?dias=" + document.getElementById("dias").value).then(function (j) {
      padrao = j.padrao; limites = j.limite_s;
      var antes = rodando.length;
      rodando = j.rodando || [];
      ultimas = j.ultimas || [];
      if (primeira) regras = j.regras;
      if (primeira || (!sujo && (antes || rodando.length))) desenharRegras();
      desenharTabelas(j);
      /* enquanto houver disparo rodando, confere de novo a cada 4 s */
      clearTimeout(espera);
      if (rodando.length) espera = setTimeout(function () { carregar(); }, 4000);
    }).catch(function (e) { aviso(e.message); });
  }
  document.getElementById("dias").addEventListener("change", function () { carregar(); });
  document.body.appendChild(el("datalist", { id: "modelos" }, MODELOS.map(function (m) { return el("option", { value: m }); })));
  window.addEventListener("beforeunload", function (e) { if (sujo) { e.preventDefault(); e.returnValue = ""; } });
  carregar(true);
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
/* PROJETOS (20/10/2026): um chat por assunto da empresa, cada um com o seu contexto (projetos.py no servidor). */
(function () {
  "use strict";
  var est = { pid: null, cid: null, detalhe: null, espera: null, ultimoN: -1 };
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, attrs, filhos) {
    var e = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === "texto") e.textContent = attrs[k];
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    });
    (filhos || []).forEach(function (f) { if (f) e.appendChild(typeof f === "string" ? document.createTextNode(f) : f); });
    return e;
  }
  function aviso(msg) { var a = $("aviso-p"); a.textContent = msg || ""; a.style.display = msg ? "block" : "none"; }
  function api(metodo, caminho, corpo, cru) {
    var h = { "X-Agente": "1" };
    if (corpo && !cru) h["Content-Type"] = "application/json";
    return fetch(caminho, { method: metodo, credentials: "same-origin", headers: metodo === "GET" ? {} : h,
                            body: cru ? corpo : (corpo ? JSON.stringify(corpo) : undefined) })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) throw new Error(j.erro || ("erro " + r.status));
          return j;
        });
      });
  }
  function quando(iso) {
    if (!iso) return "";
    var d = new Date(iso.indexOf("T") > 0 ? iso : iso.replace(" ", "T") + "-03:00");
    return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
  }
  function md(texto) {
    if (window.marked && window.DOMPurify) {
      var div = el("div", { class: "corpo" });
      div.innerHTML = DOMPurify.sanitize(marked.parse(texto || "", { breaks: true }));
      return div;
    }
    return el("div", { class: "corpo", style: "white-space:pre-wrap", texto: texto || "" });
  }
  function kb(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }

  /* ---- abas do topo ---- */
  [].forEach.call(document.querySelectorAll("[data-aba]"), function (b) {
    b.addEventListener("click", function () {
      [].forEach.call(document.querySelectorAll("[data-aba]"), function (x) { x.setAttribute("aria-selected", x === b); });
      $("vista-projetos").hidden = b.dataset.aba !== "projetos";
      $("vista-regras").hidden = b.dataset.aba !== "regras";
    });
  });

  /* ---- endereço: #p=<projeto>&c=<conversa> (o voltar do navegador funciona) ---- */
  function lerHash() {
    var h = {}; location.hash.replace(/^#/, "").split("&").forEach(function (kv) { var p = kv.split("="); if (p[0]) h[p[0]] = decodeURIComponent(p[1] || ""); });
    return h;
  }
  function irPara(pid, cid) { location.hash = pid ? "p=" + pid + (cid ? "&c=" + cid : "") : ""; }
  window.addEventListener("hashchange", rota);
  function rota() {
    var h = lerHash();
    clearTimeout(est.espera);
    if (!h.p) { est.pid = null; $("p-aberto").hidden = true; $("p-inicio").hidden = false; return carregarQuadros(); }
    $("p-inicio").hidden = true; $("p-aberto").hidden = false;
    var mudou = h.p !== est.pid;
    est.pid = h.p; est.cid = h.c ? parseInt(h.c, 10) : null; est.ultimoN = -1;
    if (mudou) { $("p-anexos").hidden = true; $("p-contexto").hidden = true; }
    carregarProjeto();
  }

  /* ---- os quadrados ---- */
  function carregarQuadros() {
    api("GET", "/api/projetos").then(function (j) {
      var c = $("p-quadros"); c.textContent = "";
      j.projetos.forEach(function (p) {
        var rodape = p.conversas + (p.conversas === 1 ? " conversa" : " conversas") +
          (p.ultima ? " · última " + quando(p.ultima) : "") + (p.anexos ? " · " + p.anexos + " anexos" : "") + " · " + p.modelo;
        c.appendChild(el("button", { type: "button", class: "quadro", onclick: function () { irPara(p.id); } }, [
          el("b", { texto: p.nome }), el("span", { class: "desc", texto: p.descricao }), el("span", { class: "rodape", texto: rodape })
        ]));
      });
    }).catch(function (e) { aviso(e.message); });
  }
  $("p-novo").addEventListener("click", function () {
    var nome = prompt("Nome do projeto novo:"); if (!nome) return;
    var id = nome.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40);
    api("POST", "/api/projetos", { id: id, nome: nome, contexto: "# Contexto: " + nome + "\n\n(escreva aqui quem você é, o objetivo e como o Claude deve agir)\n" })
      .then(function () { irPara(id); }).catch(function (e) { aviso(e.message); });
  });

  /* ---- o projeto aberto ---- */
  function carregarProjeto() {
    return api("GET", "/api/projetos/" + est.pid).then(function (d) {
      est.detalhe = d; aviso("");
      $("p-nome").textContent = d.nome;
      $("p-bt-anexos").textContent = "Anexos (" + d.anexos.length + ")";
      desenharConversas(d);
      desenharImporta(d);
      if (!$("p-anexos").hidden) desenharAnexos(d);
      if (!est.cid && d.conversas.length) { irPara(est.pid, d.conversas[0].id); return; }
      carregarConversa();
    }).catch(function (e) { aviso(e.message); });
  }
  function desenharConversas(d) {
    var c = $("p-conversas"); c.textContent = "";
    c.appendChild(el("button", { type: "button", class: "primario", style: "text-align:center", onclick: function () {
      api("POST", "/api/projetos/" + est.pid + "/conversas", {}).then(function (j) { irPara(est.pid, j.id); }).catch(function (e) { aviso(e.message); });
    } }, ["+ Nova conversa"]));
    d.conversas.forEach(function (cv) {
      c.appendChild(el("button", { type: "button", "aria-current": cv.id === est.cid ? "true" : "false", title: cv.titulo,
        onclick: function () { irPara(est.pid, cv.id); } }, [cv.titulo + (d.pendentes.indexOf(cv.id) >= 0 ? " · …" : "")]));
    });
  }
  function desenharImporta(d) {
    var box = $("p-importa");
    if (!d.nay) { box.hidden = true; return; }
    box.hidden = false; box.textContent = "";
    var n = d.nay;
    box.appendChild(el("span", { texto: n.conversas ? "Conversas da Nay no índice: " + n.conversas + " (de " + n.de.slice(8) + "/" + n.de.slice(5, 7) + " a " + n.ate.slice(8) + "/" + n.ate.slice(5, 7) + ")" : "Nenhuma conversa da Nay importada ainda." }));
    var sel = el("select", {}, [["1", "hoje"], ["7", "últimos 7 dias"], ["30", "últimos 30 dias"], ["90", "últimos 90 dias"], ["400", "tudo"]].map(function (o) { return el("option", { value: o[0], selected: o[0] === "7" }, [o[1]]); }));
    var bt = el("button", { type: "button", disabled: !!n.importando, onclick: function () {
      bt.disabled = true;
      api("POST", "/api/projetos/" + est.pid + "/importar", { dias: parseInt(sel.value, 10) }).then(function () { setTimeout(carregarProjeto, 3000); })
        .catch(function (e) { aviso(e.message); bt.disabled = false; });
    } }, [n.importando ? "Importando…" : "Importar conversas da Nay"]);
    box.appendChild(sel); box.appendChild(bt);
    if (n.ultima_importacao) box.appendChild(el("span", { style: n.ultima_importacao.ok ? "" : "color:var(--erro)", texto: "· " + n.ultima_importacao.texto }));
    if (n.importando) setTimeout(carregarProjeto, 4000);
  }

  /* ---- anexos ---- */
  $("p-bt-anexos").addEventListener("click", function () { var g = $("p-anexos"); g.hidden = !g.hidden; if (!g.hidden) desenharAnexos(est.detalhe); });
  function desenharAnexos(d) {
    var g = $("p-anexos"); g.textContent = "";
    var entrada = el("input", { type: "file", multiple: true, accept: ".txt,.md,.csv,.tsv,.json,.jsonl,.pdf,.png,.jpg,.jpeg,.xlsx" });
    var estado = el("span", { class: "pensando" });
    entrada.addEventListener("change", function () {
      var arqs = [].slice.call(entrada.files), feitos = 0;
      if (!arqs.length) return;
      estado.textContent = "enviando…";
      arqs.reduce(function (p, f) {
        return p.then(function () {
          return api("POST", "/api/projetos/" + est.pid + "/anexos?nome=" + encodeURIComponent(f.name), f, true).then(function (j) {
            feitos++; estado.textContent = feitos + " de " + arqs.length + (j.gerados && j.gerados.length ? " · virou " + j.gerados.join(", ") : "");
          });
        });
      }, Promise.resolve()).then(carregarProjeto).then(function () { desenharAnexos(est.detalhe); })
        .catch(function (e) { estado.textContent = e.message; });
    });
    g.appendChild(el("h2", {}, ["Anexos do projeto", el("span", { class: "direita", style: "font-weight:400;font-size:13px;color:var(--texto-2)", texto: "o Claude lê estes arquivos quando a pergunta precisar" })]));
    g.appendChild(el("div", { class: "acoes" }, [entrada, estado]));
    if (!d.anexos.length) g.appendChild(el("p", { class: "vazio", texto: "Nenhum anexo. Aceita .txt, .md, .csv, .tsv, .json, .pdf, imagem e .xlsx (a planilha vira um .csv por aba)." }));
    d.anexos.forEach(function (a) {
      g.appendChild(el("div", { class: "anexo" }, [el("span", { texto: a.nome, title: a.nome }), el("small", { texto: kb(a.bytes) + " · " + quando(a.em) }),
        el("button", { type: "button", onclick: function () {
          if (!confirm("Apagar " + a.nome + "?")) return;
          api("DELETE", "/api/projetos/" + est.pid + "/anexos?nome=" + encodeURIComponent(a.nome)).then(carregarProjeto).then(function () { desenharAnexos(est.detalhe); })
            .catch(function (e) { aviso(e.message); });
        } }, ["Apagar"])]));
    });
  }

  /* ---- contexto e modelo ---- */
  $("p-bt-contexto").addEventListener("click", function () {
    var g = $("p-contexto"); g.hidden = !g.hidden; if (g.hidden) return;
    var d = est.detalhe; g.textContent = "";
    var nome = el("input", { value: d.nome }), desc = el("input", { value: d.descricao || "" });
    var modelo = el("select", {}, [["haiku", "Haiku (rápido)"], ["sonnet", "Sonnet (padrão)"], ["opus", "Opus (mais profundo)"]].map(function (o) { return el("option", { value: o[0], selected: d.modelo === o[0] }, [o[1]]); }));
    var esforco = el("select", {}, [["", "padrão"], ["low", "baixo"], ["medium", "médio"], ["high", "alto"]].map(function (o) { return el("option", { value: o[0], selected: (d.esforco || "") === o[0] }, [o[1]]); }));
    var ctx = el("textarea", { rows: 18 }, [d.contexto || ""]);
    var ok = el("span", { class: "pensando" });
    g.appendChild(el("div", { class: "linha" }, [el("label", { class: "nome" }, ["Nome", nome]), el("label", {}, ["Modelo", modelo]), el("label", {}, ["Esforço", esforco])]));
    g.appendChild(el("label", {}, ["Descrição (aparece no quadrado)", desc]));
    g.appendChild(el("label", {}, ["Contexto (o Claude lê antes de cada resposta; vale para as próximas mensagens)", ctx]));
    g.appendChild(el("div", { class: "acoes" }, [el("button", { type: "button", class: "primario", onclick: function () {
      ok.textContent = "salvando…";
      api("PUT", "/api/projetos/" + est.pid, { nome: nome.value, descricao: desc.value, modelo: modelo.value, esforco: esforco.value, contexto: ctx.value })
        .then(function (j) { est.detalhe = j; $("p-nome").textContent = j.nome; ok.textContent = "salvo ✓"; }).catch(function (e) { ok.textContent = e.message; });
    } }, ["Salvar"]), ok]));
  });

  /* ---- a conversa ---- */
  function carregarConversa() {
    clearTimeout(est.espera);
    var caixa = $("p-msgs");
    if (!est.cid) {
      caixa.textContent = "";
      caixa.appendChild(el("p", { class: "vazio", texto: "Escreva a primeira mensagem: a conversa nasce com o contexto deste projeto." }));
      return;
    }
    api("GET", "/api/conversas/" + est.cid).then(function (j) {
      var n = j.mensagens.length + (j.pendente ? 0.5 : 0);
      if (n !== est.ultimoN) {
        est.ultimoN = n;
        caixa.textContent = "";
        j.mensagens.forEach(function (m) {
          if (m.papel === "voce") {
            caixa.appendChild(el("div", { class: "msg voce" }, [m.texto, el("div", { class: "meta", texto: quando(m.inicio) })]));
          } else {
            var meta = quando(m.inicio) + (m.ms_total ? " · " + Math.round(m.ms_total / 1000) + " s" : "") +
              (m.tokens_saida ? " · " + ((m.tokens_entrada || 0) + (m.tokens_saida || 0) + (m.cache_lido || 0)).toLocaleString("pt-BR") + " tokens" : "");
            caixa.appendChild(el("div", { class: "msg claude" + (m.ok ? "" : " erro") }, [
              m.ok ? md(m.texto) : el("div", { class: "corpo", texto: "Erro: " + (m.erro || "") }), el("div", { class: "meta", texto: meta })]));
          }
        });
        if (j.pendente) caixa.appendChild(el("div", { class: "msg claude" }, [el("div", { class: "pensando", id: "p-pensando" })]));
        caixa.scrollTop = caixa.scrollHeight;
      }
      $("p-enviar").disabled = !!j.pendente;
      if (j.pendente) {
        var p = $("p-pensando"); if (p) p.textContent = "Claude está lendo e pensando… " + j.pendente.segundos + " s";
        est.espera = setTimeout(carregarConversa, 2500);
      } else if (est.ultimoN % 1 === 0 && est.detalhe && est.detalhe.pendentes.indexOf(est.cid) >= 0) {
        carregarProjeto();
      }
    }).catch(function (e) { aviso(e.message); });
  }
  function enviar(ev) {
    if (ev) ev.preventDefault();
    var t = $("p-texto"), texto = t.value.trim();
    if (!texto || $("p-enviar").disabled) return;
    $("p-enviar").disabled = true;
    var cid = est.cid ? Promise.resolve(est.cid) : api("POST", "/api/projetos/" + est.pid + "/conversas", {}).then(function (j) { return j.id; });
    cid.then(function (id) {
      return api("POST", "/api/conversas/" + id + "/mensagens", { texto: texto }).then(function () {
        t.value = ""; ajustar();
        if (id !== est.cid) irPara(est.pid, id); else { est.ultimoN = -1; carregarConversa(); }
      });
    }).catch(function (e) { aviso(e.message); $("p-enviar").disabled = false; });
  }
  function ajustar() { var t = $("p-texto"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight + 2, window.innerHeight * 0.4) + "px"; }
  $("p-compor").addEventListener("submit", enviar);
  $("p-texto").addEventListener("input", ajustar);
  $("p-texto").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) enviar(e); });
  $("p-voltar").addEventListener("click", function () { irPara(null); });

  rota();
})();
</script>
