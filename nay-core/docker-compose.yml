# nay-core ao lado dos outros containers, na mesma rede do n8n e do Postgres.
# ENTREGA 1 = SOMBRA: não envia nada (a tabela core_saida só aceita 'simulado').
services:
  nay-core:
    build: .
    container_name: nay-core
    restart: always
    env_file: .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/saude"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    # sem porta publicada: o n8n alcança por http://nay-core:8000 dentro da rede.
    # A rota pública pelo traefik só entra se a Z-API aceitar uma segunda URL
    # de webhook (ver docs/DECISOES.md, "sombra").

  nay-core-worker:
    build: .
    container_name: nay-core-worker
    restart: always
    env_file: .env
    command: ["python", "-m", "nay.worker"]
    depends_on:
      - nay-core

networks:
  default:
    name: n8n-viux_default
    external: true
