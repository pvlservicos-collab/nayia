<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Apartamento 3 quartos no Horizonte Ponta Negra · Imob Easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@1.50.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#F7F2FB; --surface:#FFFFFF; --soft:#F6F1FC; --ink:#17121F; --ink-2:#3A3150; --muted:#7A7290; --line:#E8E0F2;
  --brand:#6D28D9; --brand-2:#8B3CF0; --brand-dark:#4A1D96; --brand-soft:#F1E8FF;
  --ok:#14865C; --ok-soft:#E8F6EF;
  --shadow:0 2px 6px rgba(74,29,150,.05),0 10px 30px rgba(74,29,150,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 86px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;
  background:radial-gradient(1200px 600px at 85% 10%,#EBDDFA 0%,transparent 60%),radial-gradient(900px 500px at 0% 60%,#F5E6F5 0%,transparent 60%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.lucide{width:18px;height:18px;flex:none;stroke-width:2}

/* topo do site */
.site{position:sticky;top:0;z-index:30;background:#fff;box-shadow:0 2px 14px rgba(74,29,150,.07);padding-top:env(safe-area-inset-top,0px)}
.site-in{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:6px;text-decoration:none;line-height:.85}
.logo .mk{width:34px;height:30px}
.logo .w{display:flex;flex-direction:column;font-weight:700;color:var(--brand-dark)}
.logo .w small{font-size:14px;margin-left:4px}
.logo .w span{font-size:25px;letter-spacing:-.02em}
.mode{margin-left:auto;display:flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.mode button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:500;font-size:13.5px;cursor:pointer;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--brand);color:#fff}
.btn-o{border:1.5px solid #CDB8F0;background:#fff;color:var(--brand);border-radius:999px;padding:9px 16px;font-weight:600;font-size:13px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-o:hover{background:var(--brand-soft)}
.btn{border:0;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-radius:999px;padding:12px 18px;font-weight:600;font-size:13.5px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 20px rgba(109,40,217,.28);display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:hover{filter:brightness(1.06)}

/* layout */
.page{max-width:1280px;margin:0 auto;padding:18px 24px 120px;overflow-x:clip}
.layout{display:grid;grid-template-columns:190px minmax(0,1fr) 320px;gap:22px;align-items:start}

/* menu lateral */
.nav{position:sticky;top:86px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--shadow);display:grid;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink-2)}
.nav button:hover{background:var(--soft)}
.nav .n{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.nav button svg{color:var(--brand)}
.nav button.act{background:var(--brand-soft);color:var(--brand-dark);font-weight:600}
.nav button.act .n{background:var(--brand);color:#fff}

/* ficha do título */
.fic{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.fic-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tag-t{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);padding:3px 9px;border-radius:6px}
.code{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.code svg{width:14px;height:14px}
.fic h1{margin:0;font-size:24px;line-height:1.2;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.fic .condo{margin:6px 0 2px;font-size:15px;color:var(--muted)}
.fic .condo b{color:var(--ink);font-weight:600}
.fic .loc{display:flex;align-items:center;gap:6px;font-size:14.5px;color:var(--muted)}
.fic .loc svg{width:16px;height:16px;color:var(--brand)}
.specs{display:flex;flex-wrap:wrap;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;gap:8px 18px}
.spec{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);white-space:nowrap}
.spec svg{width:16px;height:16px;color:var(--brand)}
.spec b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

/* galeria */
.gal{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:var(--shadow)}
.stage{position:relative;aspect-ratio:16/10;width:100%;max-height:75vh;border-radius:12px;overflow:hidden;background:#EDE6F7;touch-action:pan-y}
.stage img{width:100%;height:100%;max-width:100%;object-fit:cover;display:block}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.94);box-shadow:0 4px 14px rgba(0,0,0,.15);cursor:pointer;color:var(--brand-dark);display:grid;place-items:center}
.arrow svg{width:22px;height:22px}
.arrow.l{left:12px}.arrow.r{right:12px}
.count{position:absolute;right:12px;bottom:12px;background:rgba(23,18,31,.72);color:#fff;font-size:13px;font-weight:500;padding:4px 10px;border-radius:999px}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.thumbs button{flex:0 0 92px;aspect-ratio:4/3;border-radius:9px;overflow:hidden;border:2.5px solid transparent;padding:0;cursor:pointer;background:#EDE6F7;opacity:.7}
.thumbs button img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button.on{border-color:var(--brand);opacity:1}

/* blocos */
.blk{background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:12px;box-shadow:var(--shadow)}
.blk-h{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.blk-h .n{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.blk-h h2{margin:0;font-size:16.5px;font-weight:600;color:var(--brand-dark)}
.blk-b{padding:10px 16px 16px}
.sub-t{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:4px 0 8px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.kv div{background:var(--soft);border-radius:10px;padding:7px 10px;min-width:0}
.kv small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.kv b{display:block;font-size:15px;font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.kv + .sub-t,.desc + .sub-t{margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 9px;font-size:14px;font-weight:400;color:var(--ink)}
.pill svg{width:16px;height:16px;color:var(--brand)}
.none{font-size:13.5px;color:var(--muted);margin:0}
.desc{white-space:pre-line;margin:0;font-size:15px;color:var(--ink-2);background:var(--soft);border-radius:12px;padding:10px 12px}

/* mapa */
.map{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:21/9;background:#E9EEF0;border:1px solid var(--line)}
.map svg.mp{width:100%;height:100%;display:block}
.maptag{position:absolute;left:12px;top:12px;background:#fff;border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;align-items:center;gap:5px}
.maptag svg{width:14px;height:14px;color:var(--brand)}
.addr{margin:10px 0 12px}
.addr b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.addr small{color:var(--muted);font-size:13.5px}

/* coluna direita */
.aside{position:sticky;top:86px;display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.price small{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.price .big{font-size:30px;font-weight:600;color:var(--ink);line-height:1.05;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.price .big span{font-size:15px;font-weight:400;color:var(--muted)}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.rows div span:first-child{color:var(--muted)}
.rows div b{font-weight:500}
.rows .na{color:var(--muted);font-weight:500;font-style:italic}
.rows .tot{border-top:1.5px solid var(--line);padding-top:9px;margin-top:2px}
.rows .tot b{color:var(--brand-dark);font-size:15.5px;font-weight:600}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600;color:var(--brand-dark)}
.card p.h{margin:0 0 12px;font-size:13px;color:var(--muted)}
.acts{display:grid;gap:8px}
.btn .two-l{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-align:left}
.btn .two-l small{font-size:11px;font-weight:400;letter-spacing:.02em;text-transform:none;opacity:.85}
.add[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.price-m{display:none}
.fl{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.phone{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;font-size:16px;font-variant-numeric:tabular-nums;outline:none}
.phone:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.phone.bad{border-color:#D92D20}
.err{min-height:0;margin:4px 0 8px;font-size:12.5px;color:#B42318}
.err:empty{margin:0 0 10px}
.cart-phone{padding:12px 14px 4px;border-bottom:1px solid var(--line);background:#FBF9FE}

/* lista de envio (fica no canto, acompanha a navegação) */
.dock{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.dock-btn{display:flex;align-items:center;gap:10px;border:0;background:var(--brand-dark);color:#fff;border-radius:999px;padding:12px 16px 12px 14px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 10px 30px rgba(74,29,150,.35)}
.dock-btn .badge{background:#fff;color:var(--brand-dark);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12.5px;padding:0 6px}
.dock-btn.pulse{animation:pulse .6s ease}
@keyframes pulse{50%{transform:scale(1.08)}}
.panel{width:min(360px,calc(100vw - 32px));max-height:min(520px,70vh);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 50px rgba(74,29,150,.25);display:none;flex-direction:column;overflow:hidden}
.dock.open .panel{display:flex}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 16px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
.panel-h b{font-size:15.5px;font-weight:600}
.panel-h small{display:block;font-size:12.5px;opacity:.85}
.panel-h button{margin-left:auto;border:0;background:rgba(255,255,255,.18);color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.items{overflow-y:auto;padding:8px;display:grid;gap:6px;flex:1}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;padding:6px;border-radius:12px;background:var(--soft)}
.item.new{animation:flash 1.2s ease}
@keyframes flash{0%{background:#E2D2FF}100%{background:var(--soft)}}
.item img{width:56px;height:44px;border-radius:8px;object-fit:cover;display:block}
.item b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{display:block;font-size:12.5px;color:var(--muted)}
.item button{border:0;background:transparent;color:var(--muted);cursor:pointer;width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.item button:hover{background:#fff;color:#B42318}
.item button svg{width:16px;height:16px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.panel-f{padding:10px 12px 12px;border-top:1px solid var(--line);display:grid;gap:6px}
.panel-f .clear{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}

.mbar{display:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* tablet: menu vira trilho de ícones à esquerda */
@media (max-width:1180px){
  .layout{grid-template-columns:64px minmax(0,1fr) 300px;gap:16px}
  .nav{padding:6px 4px}
  .nav button{flex-direction:column;gap:3px;padding:8px 2px;font-size:10.5px;text-align:center;line-height:1.1}
  .nav button svg{width:20px;height:20px}
  .nav .n{position:absolute;top:3px;left:6px;width:16px;height:16px;font-size:10px}
}
/* celular: sem menu lateral, fotos ocupam a largura toda */
@media (max-width:860px){
  .page{padding:0 12px 150px}
  .layout{grid-template-columns:minmax(0,1fr);gap:0}
  .nav{display:none}
  main{display:flex;flex-direction:column}
  .gal{order:-1;width:auto;max-width:none;margin:0 -12px 12px;border:0;border-radius:0;padding:0;box-shadow:none;background:transparent}
  .stage{border-radius:0;aspect-ratio:4/3}
  .thumbs{padding:0 12px}
  .thumbs button{flex-basis:72px}
  .arrow{width:36px;height:36px}
  .aside{position:static;margin-top:12px}
  .aside .price{display:none}
  .price-m{display:block;margin-top:12px}
  .two{grid-template-columns:1fr}
  .fic{padding:14px}
  .fic h1{font-size:20px}
  .blk-b{padding:10px 12px 14px}
  .blk-h{padding:12px 12px 0}
  .map{aspect-ratio:4/3}
  .mbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;box-shadow:0 -4px 18px rgba(74,29,150,.1);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  .mbar button{font-size:12px;padding:12px 8px;letter-spacing:.03em}
  .dock{right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .dock-btn{padding:10px 14px 10px 12px;font-size:13px}
  .panel{max-height:calc(100vh - 170px)}
  .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  html{scroll-padding-top:70px}
}
/* celulares pequenos (até 400px) */
@media (max-width:400px){
  .site-in{padding:10px 12px}
  .logo .mk{width:28px;height:25px}
  .logo .w small{font-size:12px}
  .logo .w span{font-size:19px}
  .page{padding:0 10px 150px}
  .gal{margin:0 -10px 10px}
  .fic{padding:12px;border-radius:14px}
  .fic h1{font-size:18px}
  .fic .condo{font-size:14px}
  .fic .loc{font-size:13.5px}
  .specs{gap:6px 12px}
  .spec{font-size:13px}
  .code{margin-left:0}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv b{font-size:14px}
  .pill{font-size:13px;padding:4px 10px 4px 8px}
  .price .big{font-size:26px}
  .thumbs button{flex-basis:62px}
  .card{padding:14px;border-radius:14px}
  .mbar{padding-left:8px;padding-right:8px}
  .mbar button{font-size:11px;padding:11px 4px;gap:5px}
  .mbar svg.lucide{width:15px;height:15px}
  .dock-btn{font-size:12px;padding:9px 12px 9px 10px}
}
</style>
</head>
<body>

<header class="site">
  <div class="site-in">
    <a class="logo" href="https://imobeasy.online" aria-label="Imob Easy">
      <svg class="mk" viewBox="0 0 34 30" aria-hidden="true"><path d="M3 11 L10 4 L17 11" fill="none" stroke="#E6007E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 15 Q14 27 24 15" fill="none" stroke="#E6007E" stroke-width="4.5" stroke-linecap="round"/><rect x="24" y="6" width="7" height="5" rx="1.5" fill="#E6007E"/></svg>
      <span class="w"><small>imob</small><span>easy</span></span>
    </a>
  </div>
</header>

<div class="page">
  <div class="layout">
    <nav class="nav" id="nav" aria-label="Seções"></nav>

    <main>
      <section class="fic" id="fic"></section>

      <section class="gal" id="s-fotos" aria-label="Fotos">
        <div class="stage" id="stage">
          <img id="mainImg" alt="">
          <button class="arrow l" id="prev" aria-label="Foto anterior"><i data-lucide="chevron-left"></i></button>
          <button class="arrow r" id="next" aria-label="Próxima foto"><i data-lucide="chevron-right"></i></button>
          <span class="count" id="count"></span>
        </div>
        <div class="thumbs" id="thumbs"></div>
      </section>

      <div class="card price price-m" id="priceMobile"></div>

      <section class="blk" id="s-carac"><div class="blk-h"><span class="n">2</span><h2>Características</h2></div><div class="blk-b" id="caracB"></div></section>
      <section class="blk" id="s-oquetem"><div class="blk-h"><span class="n">3</span><h2>O que tem</h2></div><div class="blk-b two" id="oqtB"></div></section>
      <section class="blk" id="s-valores"><div class="blk-h"><span class="n">4</span><h2>Valores e negócio</h2></div><div class="blk-b" id="valB"></div></section>
      <section class="blk" id="s-local"><div class="blk-h"><span class="n">5</span><h2>Localização</h2></div><div class="blk-b" id="locB"></div></section>
    </main>

    <aside class="aside">
      <div class="card price" id="priceCard"></div>

      <div class="card actcard" id="sendCard">
        <h3>Gostou deste imóvel?</h3>
        <p class="h">Receba as informações e as fotos só deste imóvel no seu WhatsApp.</p>
        <label class="fl" for="phone1">Seu WhatsApp</label>
        <input class="phone" id="phone1" type="tel" inputmode="numeric" autocomplete="tel" placeholder="(92) 99999-9999" data-phone>
        <p class="err" id="err1" role="alert"></p>
        <div class="acts">
          <button class="btn" data-act="send"><i data-lucide="send"></i>Me envia o imóvel</button>
          <button class="btn-o add" data-act="add" aria-pressed="false"></button>
        </div>
      </div>
    </aside>
  </div>
</div>

<div class="mbar">
  <button class="btn" data-act="sendm"><i data-lucide="send"></i>Me envia</button>
  <button class="btn-o add" data-act="add" aria-pressed="false"></button>
</div>

<div class="dock" id="dock">
  <div class="panel" role="dialog" aria-label="Lista de envio">
    <div class="panel-h">
      <i data-lucide="list-checks"></i>
      <div><b>Lista de envio</b><small id="dockSub"></small></div>
      <button data-act="close" aria-label="Minimizar"><i data-lucide="chevron-down"></i></button>
    </div>
    <div class="cart-phone">
      <label class="fl" for="phone2">Seu WhatsApp</label>
      <input class="phone" id="phone2" type="tel" inputmode="numeric" autocomplete="tel" placeholder="(92) 99999-9999" data-phone>
      <p class="err" id="err2" role="alert"></p>
    </div>
    <div class="items" id="items"></div>
    <div class="panel-f">
      <button class="btn" data-act="sendlist" id="sendListBtn"><i data-lucide="send"></i>Enviar lista</button>
      <button class="clear" data-act="clear">Limpar lista</button>
    </div>
  </div>
  <button class="dock-btn" id="dockBtn" data-act="toggle" aria-expanded="false"><i data-lucide="list-checks"></i>Lista de envio<span class="badge" id="badge">0</span></button>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
/* ===== Dados de exemplo. Os nomes seguem os campos do cadastro. ===== */
const IMOVEL={
  codigo:"1534", slug:"apartamento-3-quartos-horizonte-ponta-negra",
  titulo:"Apartamento 3 quartos no Horizonte Ponta Negra",
  local:{condominio:"Horizonte Ponta Negra",rua:"Avenida do Turismo",numero:"",complemento:"",bairro:"Tarumã-Açu",cidade:"Manaus",estado:"AM",cep:"69023-001",andar:"9"},
  carac:{tipo:"Apartamento",quartos:"3",suites:"1",banheiros:"2",salas:"1",vagas:"2",vagascob:"2",mobilia:"",face:"Nascente",
         areautil:"77",areatotal:"",areacons:"",terreno:"",frente:"",fundo:"",pedireito:"",andares:"",elevadores:"2",escadas:"",cobertura:""},
  tagsimovel:["Área de serviço","Churrasqueira","Varanda"],
  tagscondo:["Condomínio fechado","Segurança 24h","Elevador","Portaria"],
  valores:{aluguel:"4.800",venda:"",condo:"",iptu:"",fin:"",permuta:""},
  incluso:[], garantia:["Seguro fiança","Depósito caução"],
  desc:"Apartamento em prédio novo, recém-entregue, a 2 minutos da orla da Ponta Negra.\n\n3 quartos (1 suíte), 2 vagas, 9º andar, 100% nascente, com varanda ampla e churrasqueira. Vista para o Rio Negro e a Ponte Rio Negro.",
  fotos:["Fachada","Vista da varanda","Sala","Varanda gourmet","Cozinha","Suíte","Quarto 2","Área de lazer"],
  pin:{x:57,y:46}
};
const CAMPOS={
  imovel:[["tipo","Tipo"],["quartos","Quartos"],["suites","Suítes"],["banheiros","Banheiros"],["salas","Salas"],["vagas","Vagas"],["vagascob","Vagas cobertas"],["mobilia","Mobília"],["face","Face solar"]],
  medidas:[["areautil","Área útil","m²"],["areatotal","Área total","m²"],["areacons","Área construída","m²"],["terreno","Terreno","m²"],["frente","Frente","m"],["fundo","Fundo","m"],["pedireito","Pé-direito","m"]],
  predio:[["andares","Andares"],["elevadores","Elevadores"],["escadas","Lances de escada"],["cobertura","Cobertura"]]
};
/* ícones Lucide para "O que tem" (todos na mesma cor) */
const ICONE=[[/ar.?condicionado|split|climatiz/,"snowflake"],[/piscina/,"waves"],[/academia|fitness/,"dumbbell"],[/churrasq|gourmet/,"flame"],[/varanda|sacada/,"sunset"],[/elevador/,"arrow-up-down"],[/portaria|porteiro/,"concierge-bell"],[/seguran|vigil/,"shield-check"],[/c[aâ]mera|cftv/,"cctv"],[/playground|brinquedo/,"baby"],[/\bpet\b/,"paw-print"],[/festa/,"party-popper"],[/quadra/,"trophy"],[/sauna/,"thermometer"],[/garagem/,"car"],[/mobiliad/,"sofa"],[/arm[aá]rio|closet/,"door-closed"],[/cozinha/,"cooking-pot"],[/lavanderia|[aá]rea de servi/,"washing-machine"],[/banheira|hidro/,"bath"],[/solar/,"sun"],[/gerador/,"zap"],[/internet|wi.?fi/,"wifi"],[/jardim|quintal|verde/,"trees"],[/fechado/,"lock"],[/vista/,"mountain"]];
const ico=v=>{const s=v.toLowerCase();const m=ICONE.find(([r])=>r.test(s));return m?m[1]:"check"};
const i=n=>`<i data-lucide="${n}"></i>`;
const drawIcons=()=>{ try{ window.lucide && lucide.createIcons(); }catch(e){} };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const has=v=>v!==undefined&&v!==null&&String(v).trim()!=="";
const I=IMOVEL, L=I.local, C=I.carac, V=I.valores;
const pub=()=>false;

/* fotos de demonstração */
const PAL=[["#7C5CD6","#E7A6D8"],["#3E7CB1","#A8DADC"],["#B5838D","#FFCDB2"],["#6D597A","#E5989B"],["#457B9D","#F1FAEE"],["#9D4EDD","#FFD6FF"],["#2A9D8F","#E9F5DB"],["#5E60CE","#80FFDB"]];
function fakePhoto(k,label){
  const [a,b]=PAL[k%PAL.length];
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="800" height="500" fill="url(#g)"/><g fill="#fff" opacity=".22"><rect x="300" y="120" width="200" height="300" rx="6"/><rect x="520" y="200" width="120" height="220" rx="6"/><rect x="170" y="230" width="110" height="190" rx="6"/></g><g fill="#fff" opacity=".35">${Array.from({length:12},(_,q)=>`<rect x="${320+(q%3)*58}" y="${140+Math.floor(q/3)*62}" width="40" height="40" rx="4"/>`).join("")}</g><text x="40" y="460" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">${label}</text><text x="40" y="60" font-family="Arial,sans-serif" font-size="20" fill="#fff" opacity=".8">foto de exemplo</text></svg>`;
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
const FOTOS=I.fotos.map((l,k)=>({src:fakePhoto(k,l),alt:l}));
let cur=0;
function showPhoto(n){
  cur=(n+FOTOS.length)%FOTOS.length;
  $("#mainImg").src=FOTOS[cur].src; $("#mainImg").alt=FOTOS[cur].alt;
  $("#count").textContent=`${cur+1} / ${FOTOS.length}`;
  document.querySelectorAll(".thumbs button").forEach((b,k)=>{b.classList.toggle("on",k===cur); if(k===cur) b.scrollIntoView({inline:"nearest",block:"nearest"});});
}

function kvList(list,src){
  const items=list.filter(([k])=>has(src[k])).map(([k,l,u])=>`<div><small>${l}</small><b>${esc(src[k])}${u?" "+u:""}</b></div>`).join("");
  return items?`<div class="kv">${items}</div>`:"";
}
function render(){
  /* ficha */
  const specs=[["ruler",C.areautil,"m²"],["bed-double",C.quartos,C.quartos==="1"?"quarto":"quartos"],["bath",C.suites,C.suites==="1"?"suíte":"suítes"],["shower-head",C.banheiros,C.banheiros==="1"?"banheiro":"banheiros"],["car",C.vagas,C.vagas==="1"?"vaga":"vagas"]].filter(s=>has(s[1]));
  const negocio=has(V.aluguel)&&has(V.venda)?"Aluguel e venda":has(V.aluguel)?"Aluguel":"Venda";
  $("#fic").innerHTML=`
    <div class="fic-top">${has(C.tipo)?`<span class="tag-t">${esc(C.tipo)}</span>`:""}<span class="tag-t">${negocio}</span><span class="code">${i("hash")}Código ${esc(I.codigo)}</span></div>
    <h1>${esc(I.titulo)}</h1>
    ${has(L.condominio)?`<p class="condo">Condomínio: <b>${esc(L.condominio)}</b></p>`:""}
    <div class="loc">${i("map-pin")}${esc([L.bairro,[L.cidade,L.estado].filter(has).join(" - ")].filter(has).join(" · "))}</div>
    <div class="specs">${specs.map(([n,v,l])=>`<div class="spec">${i(n)}<b>${esc(v)}</b>${l}</div>`).join("")}</div>`;

  /* fotos */
  $("#thumbs").innerHTML=FOTOS.map((f,k)=>`<button aria-label="Ver foto ${k+1}: ${esc(f.alt)}" data-ph="${k}"><img src="${f.src}" alt="" loading="lazy"></button>`).join("");
  showPhoto(0);

  /* características: descrição primeiro */
  let ch=has(I.desc)?`<p class="sub-t">Descrição</p><p class="desc">${esc(I.desc)}</p>`:"";
  [["O imóvel",CAMPOS.imovel],["Medidas",CAMPOS.medidas],["Prédio",CAMPOS.predio]].forEach(([t,l])=>{const k=kvList(l,C); if(k) ch+=`<p class="sub-t">${t}</p>${k}`;});
  $("#caracB").innerHTML=ch||`<p class="none">Nada cadastrado.</p>`;

  /* o que tem */
  const pl=a=>a.length?`<div class="pills">${a.map(v=>`<span class="pill">${i(ico(v))}${esc(v)}</span>`).join("")}</div>`:`<p class="none">Nada cadastrado.</p>`;
  $("#oqtB").innerHTML=`<div><p class="sub-t">Características do imóvel</p>${pl(I.tagsimovel)}</div><div><p class="sub-t">Características do condomínio</p>${pl(I.tagscondo)}</div>`;

  /* valores */
  const money=[["aluguel","Aluguel"],["venda","Venda"],["condo","Condomínio"],["iptu","IPTU"]].filter(([k])=>has(V[k])).map(([k,l])=>`<div><small>${l}</small><b>R$ ${esc(V[k])}</b></div>`).join("")
    + `<div><small>Honorários</small><b>50/50</b></div>`;
  const neg=[["fin","Aceita financiamento"],["permuta","Permuta"]].filter(([k])=>has(V[k])).map(([k,l])=>`<div><small>${l}</small><b>${esc(V[k])}</b></div>`).join("");
  const simple=a=>a.length?`<div class="pills">${a.map(v=>`<span class="pill">${i("check")}${esc(v)}</span>`).join("")}</div>`:`<p class="none">Não informado</p>`;
  $("#valB").innerHTML=((money||neg)?`<div class="kv">${money}${neg}</div>`:"")+`<div class="two" style="margin-top:14px"><div><p class="sub-t">Incluso no aluguel</p>${simple(I.incluso)}</div><div><p class="sub-t">Garantia de aluguel</p>${simple(I.garantia)}</div></div>`;

  renderPrice(); renderLocal(); renderNav(); drawIcons();
}
function renderPrice(){
  const isRent=has(V.aluguel), main=isRent?V.aluguel:V.venda;
  const num=s=>Number(String(s).replace(/\./g,"").replace(",","."))||0;
  let rows=`<div><span>${isRent?"Aluguel":"Venda"}</span><b>R$ ${esc(main)}</b></div>`;
  if(isRent&&has(V.venda)) rows+=`<div><span>Venda</span><b>R$ ${esc(V.venda)}</b></div>`;
  rows+=`<div><span>Condomínio</span>${has(V.condo)?`<b>R$ ${esc(V.condo)}</b>`:`<span class="na">não informado</span>`}</div>`;
  rows+=`<div><span>IPTU</span>${has(V.iptu)?`<b>R$ ${esc(V.iptu)}</b>`:`<span class="na">não informado</span>`}</div>`;
  if(isRent&&has(V.condo)) rows+=`<div class="tot"><span>Aluguel + condomínio</span><b>R$ ${(num(V.aluguel)+num(V.condo)).toLocaleString("pt-BR")}</b></div>`;
  const html=`<small>${isRent?"Aluguel":"Venda"}</small><div class="big">R$ ${esc(main)}${isRent?"<span>/mês</span>":""}</div><div class="rows">${rows}</div>`;
  $("#priceCard").innerHTML=html; $("#priceMobile").innerHTML=html;
}
function renderLocal(){
  const p=pub();
  const linha1=[L.rua,L.numero].filter(has).join(", ")+(has(L.complemento)?` · ${L.complemento}`:"");
  const linha2=[L.bairro,[L.cidade,L.estado].filter(has).join(" - "),L.cep].filter(has).join(", ");
  const campos=p?[["condominio","Condomínio"],["bairro","Bairro"],["cidade","Cidade"]]:[["condominio","Condomínio"],["rua","Rua / avenida"],["numero","Número"],["complemento","Complemento"],["bairro","Bairro"],["cidade","Cidade"],["estado","Estado"],["cep","CEP"],["andar","Andar"]];
  $("#locB").innerHTML=`<div class="map">${mapSVG(p)}<span class="maptag">${i("map-pin")}${p?"Região aproximada":"Localização exata"}</span></div>
   <div class="addr"><b>${esc(p?(L.condominio||L.bairro):linha1)}</b><small>${esc(p?[L.bairro,[L.cidade,L.estado].join(" - ")].join(", "):linha2)}</small></div>${kvList(campos,L)}`;
}
function mapSVG(approx){
  const px=I.pin.x*8, py=I.pin.y*3.6;
  return `<svg class="mp" viewBox="0 0 800 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mapa da localização">
  <rect width="800" height="360" fill="#EEF1EC"/>
  <path d="M0 250 C120 230 200 300 330 290 S560 330 800 300 L800 360 L0 360Z" fill="#BFD8E8"/>
  <text x="70" y="335" font-family="Arial" font-size="15" fill="#6A8FA8" font-style="italic">Rio Negro</text>
  <g fill="#DDE8D5"><rect x="40" y="40" width="140" height="90" rx="10"/><rect x="600" y="60" width="150" height="110" rx="10"/><rect x="250" y="150" width="90" height="70" rx="10"/></g>
  <g stroke="#fff" stroke-width="14" fill="none" stroke-linecap="round"><path d="M0 180 L800 140"/><path d="M420 0 L470 360"/><path d="M200 0 L240 260"/><path d="M560 20 L640 280"/></g>
  <path d="M0 180 L800 140" stroke="#F6D58E" stroke-width="9" fill="none" stroke-linecap="round"/>
  <g stroke="#fff" stroke-width="6" fill="none"><path d="M0 90 L800 70"/><path d="M0 230 L330 215"/><path d="M500 220 L800 205"/></g>
  <text x="20" y="172" font-family="Arial" font-size="13" fill="#8A7A55" font-weight="700">Av. do Turismo</text>
  ${approx?`<circle cx="${px}" cy="${py}" r="78" fill="rgba(109,40,217,.16)" stroke="#6D28D9" stroke-width="2" stroke-dasharray="6 5"/>`
   :`<circle cx="${px}" cy="${py+2}" r="14" fill="rgba(109,40,217,.18)"/><path d="M${px} ${py} c-16 -20 -22 -30 -22 -40 a22 22 0 0 1 44 0 c0 10 -6 20 -22 40z" fill="#6D28D9" stroke="#fff" stroke-width="3"/><circle cx="${px}" cy="${py-40}" r="8" fill="#fff"/>`}
  </svg>`;
}
const NAV=[["s-fotos","Fotos","images"],["s-carac","Características","layout-list"],["s-oquetem","O que tem","sparkles"],["s-valores","Valores","banknote"],["s-local","Localização","map-pin"]];
function renderNav(){ $("#nav").innerHTML=NAV.map(([id,l,n],k)=>`<button data-go="${id}" aria-label="${k+1}. ${l}"><span class="n">${k+1}</span>${i(n)}<span>${l}</span></button>`).join(""); }

/* ===== lista de envio: fica salva e acompanha a navegação ===== */
const KEY="imobeasy_lista_envio";
const DEMO=[{codigo:"1102",titulo:"Casa 4 quartos no Alphaville",sub:"Ponta Negra · R$ 9.500/mês",foto:fakePhoto(3,"")},{codigo:"0987",titulo:"Apartamento 2 quartos no Parque 10",sub:"Parque 10 · R$ 2.800/mês",foto:fakePhoto(6,"")}];
let lista;
try{ lista=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){ lista=null; }
if(!Array.isArray(lista)) lista=DEMO.slice();
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(lista)); }catch(e){} };
const inList=()=>lista.some(x=>x.codigo===I.codigo);
function renderList(newCode){
  $("#badge").textContent=lista.length;
  $("#dockSub").textContent=`${lista.length} ${lista.length===1?"imóvel selecionado":"imóveis selecionados"}`;
  $("#sendListBtn").innerHTML=`${i("send")}${lista.length?`Enviar ${lista.length===1?"o imóvel":`os ${lista.length} imóveis`}`:"Enviar lista"}`;
  $("#items").innerHTML=lista.length?lista.map(x=>`<div class="item${x.codigo===newCode?" new":""}"><img src="${x.foto}" alt=""><div><b>${esc(x.titulo)}</b><small>${esc(x.sub)}</small></div><button data-rm="${x.codigo}" aria-label="Tirar da lista">${i("trash-2")}</button></div>`).join(""):`<div class="empty">Sua lista está vazia.<br>Use “Incluir na lista de envio” nos imóveis.</div>`;
  const on=inList();
  document.querySelectorAll(".add").forEach(b=>{ const m=!!b.closest(".mbar"); b.setAttribute("aria-pressed",on); b.innerHTML=on?`${i("list-checks")}${m?"Na lista":"Está na lista de envio"}`:`${i("list-plus")}${m?"Incluir na lista":"Incluir na lista de envio"}`; });
  drawIcons();
}
function openDock(o){ $("#dock").classList.toggle("open",o); $("#dockBtn").setAttribute("aria-expanded",o); }

function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),2800)}

/* número do WhatsApp: um só, usado nos dois campos e lembrado no navegador */
const PKEY="imobeasy_whatsapp";
const digits=s=>String(s||"").replace(/\D/g,"").slice(0,11);
function fmt(s){ const d=digits(s); if(!d) return ""; if(d.length<=2) return `(${d}`; if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`; if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; }
let phone=""; try{ phone=localStorage.getItem(PKEY)||""; }catch(e){}
function syncPhones(src){ document.querySelectorAll("[data-phone]").forEach(el=>{ if(el!==src) el.value=fmt(phone); el.classList.remove("bad"); }); ["err1","err2"].forEach(id=>$("#"+id).textContent=""); }
function checkPhone(inputId,errId){ const ok=digits(phone).length>=10; const el=$("#"+inputId); el.classList.toggle("bad",!ok); $("#"+errId).textContent=ok?"":"Digite seu WhatsApp com DDD"; if(!ok) el.focus(); return ok; }
document.addEventListener("input",e=>{ if(!e.target.matches("[data-phone]")) return; phone=digits(e.target.value); e.target.value=fmt(phone); try{ localStorage.setItem(PKEY,phone); }catch(err){} syncPhones(e.target); });

render(); renderList(); syncPhones();

document.addEventListener("click",e=>{
  const t=e.target.closest("button,a[data-act]"); if(!t) return;
  if(t.dataset.ph) showPhoto(+t.dataset.ph);
  if(t.dataset.go) document.getElementById(t.dataset.go).scrollIntoView({block:"start"});
  if(t.dataset.rm){ lista=lista.filter(x=>x.codigo!==t.dataset.rm); save(); renderList(); }
  const a=t.dataset.act;
  if(a==="send"){ if(checkPhone("phone1","err1")) toast(`Enviando informações e ${FOTOS.length} fotos para ${fmt(phone)}`); }
  if(a==="sendm"){ if(digits(phone).length>=10) toast(`Enviando informações e ${FOTOS.length} fotos para ${fmt(phone)}`); else { $("#sendCard").scrollIntoView({block:"center"}); setTimeout(()=>$("#phone1").focus(),350); } }
  if(a==="add"){
    if(inList()){ lista=lista.filter(x=>x.codigo!==I.codigo); save(); renderList(); toast("Tirado da lista de envio"); }
    else{ lista.push({codigo:I.codigo,titulo:I.titulo,sub:`${L.bairro} · R$ ${V.aluguel||V.venda}${V.aluguel?"/mês":""}`,foto:FOTOS[0].src}); save(); renderList(I.codigo); openDock(true); const b=$("#dockBtn"); b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse"); }
  }
  if(a==="toggle") openDock(!$("#dock").classList.contains("open"));
  if(a==="close") openDock(false);
  if(a==="sendlist"){ if(!lista.length) toast("A lista está vazia"); else if(checkPhone("phone2","err2")) toast(`Enviando ${lista.length} ${lista.length===1?"imóvel":"imóveis"} para ${fmt(phone)}`); }
  if(a==="clear"){ lista=[]; save(); renderList(); }
});
$("#prev").onclick=()=>showPhoto(cur-1);
$("#next").onclick=()=>showPhoto(cur+1);
document.addEventListener("keydown",e=>{ if(e.target.matches("input,textarea")) return; if(e.key==="ArrowLeft") showPhoto(cur-1); if(e.key==="ArrowRight") showPhoto(cur+1); if(e.key==="Escape") openDock(false); });
let sx=null; const stg=$("#stage");
stg.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
stg.addEventListener("touchend",e=>{ if(sx===null) return; const d=e.changedTouches[0].clientX-sx; if(Math.abs(d)>40) showPhoto(cur+(d<0?1:-1)); sx=null; });
const io=new IntersectionObserver(en=>en.forEach(x=>{ if(x.isIntersecting) document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("act",b.dataset.go===x.target.id)); }),{rootMargin:"-35% 0px -60% 0px"});
NAV.forEach(([id])=>io.observe(document.getElementById(id)));
</script>
</body>
</html>
