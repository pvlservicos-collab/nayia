services:
  site-api:
    build: .
    container_name: nay-site-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - WRITE_DATABASE_URL=${WRITE_DATABASE_URL}
      - TABELAS_DATABASE_URL=${TABELAS_DATABASE_URL}
      - CONTEUDO_DATABASE_URL=${CONTEUDO_DATABASE_URL}
      - LISTAS_DATABASE_URL=${LISTAS_DATABASE_URL}
      - NAI_DATABASE_URL=${NAI_DATABASE_URL}
      - HEARTBEAT_DIR=/heartbeats
      # O hash do basicauth do /admin (o mesmo do Traefik). A tela Vagas do
      # painel confere a senha AQUI DENTRO tambem: este processo atende
      # api.imobeasy.online, que nao tem senha nenhuma.
      - ADMIN_HTPASSWD=${ADMIN_HTPASSWD}
      # A aba Enviar imovel (28/09) repassa ao CRM pela rede interna, com um
      # token `atl_` do CRM. O token mora so no .env do servidor.
      - CRM_API_BASE=http://crm-imobeasy:3000
      - CRM_API_TOKEN=${CRM_API_TOKEN}
      # A captacao pela OLX (28/09) grava as fotos onde o nginx do site serve:
      # https://imobeasy.online/fotos-captacao/olx/<codigo>/01.jpg
      - FOTOS_CAPTACAO_DIR=/fotos
      - FOTOS_CAPTACAO_URL=https://imobeasy.online/fotos-captacao
      # A foto que o dono manda na conversa da captacao (164) chega do n8n da
      # VPS2 com esta senha de maquina. Mora so no .env daqui e na credencial
      # "Captacao fotos (site)" do n8n da VPS2 (cifrada la dentro).
      - CAPTACAO_FOTO_SEGREDO=${CAPTACAO_FOTO_SEGREDO}
    volumes:
      - /root/nay-publicador/logs:/heartbeats:ro
      - /docker/nay-site-web/public/fotos-captacao:/fotos
    # localhost por enquanto -- mesma logica do nay-painel: sem DNS ainda,
    # sem expor pra internet. Testado por SSH.
    ports:
      - "127.0.0.1:8092:8092"
    labels:
      - traefik.enable=true
      - traefik.http.routers.nay-site-api.rule=Host(`api.imobeasy.online`)
      - traefik.http.routers.nay-site-api.entrypoints=websecure
      - traefik.http.routers.nay-site-api.tls.certresolver=letsencrypt
      - traefik.http.services.nay-site-api.loadbalancer.server.port=8092

      # /admin/api no dominio do site -> esta API, atras do MESMO cadeado do
      # /admin (middleware definido no compose do nay-site-web). Assim a tela
      # Vagas chama o proprio dominio e o navegador reaproveita a senha que o
      # Tel ja digitou. Prioridade acima do router do /admin (1000), senao o
      # nginx responderia 404 no lugar da API.
      - traefik.http.routers.nay-site-admin-api.rule=(Host(`imobeasy.online`) || Host(`www.imobeasy.online`)) && PathPrefix(`/admin/api`)
      - traefik.http.routers.nay-site-admin-api.entrypoints=websecure
      - traefik.http.routers.nay-site-admin-api.tls.certresolver=letsencrypt
      - traefik.http.routers.nay-site-admin-api.priority=2000
      - traefik.http.routers.nay-site-admin-api.middlewares=nay-site-admin-auth@docker
      - traefik.http.routers.nay-site-admin-api.service=nay-site-api

networks:
  default:
    name: n8n-viux_default
    external: true
