<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corretores — Imob Easy</title>
<link rel="icon" href="../assets/img/logo-simbolo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin" data-pagina="corretores">

<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<div data-layout-topo></div>

<main class="conteudo" id="conteudo">
  <div class="pagina-cabecalho">
    <div>
      <h1 class="pagina-titulo">Corretores</h1>
      <p class="pagina-subtitulo" data-valor="corretoresParceiros" style="display:inline"></p>
    </div>
  </div>

  <p style="font-size:var(--fs-sm);color:var(--texto-fraco);margin-bottom:16px">
    Sem nome nem CRECI aqui de propósito -- essa tela ainda não tem login, então a identificação
    fica só pelo telefone (mascarado). É quem já falou com a Nay pelo WhatsApp, não quem tem
    cadastro no site.
  </p>

  <div id="filtro-vencimento-corretores"></div>
  <p class="contagem-lista" id="contagem-corretores" style="font-size:var(--fs-sm);color:var(--texto-fraco)"></p>
  <div class="grade-cartoes" id="cartoes-corretores"></div>
</main>

<div data-layout-rodape></div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/admin.js"></script>
<script src="../assets/js/filtro-vencimento.js"></script>
<script>
  criarFiltroVencimento({
    container: document.getElementById("filtro-vencimento-corretores"),
    area: "corretores",
    somentePassado: true,
    rotuloPassado: "Sem interação desde",
    buscar: function (de, ate) {
      var q = new URLSearchParams({ limit: 2000 });
      if (de) q.set("de", de);
      if (ate) q.set("ate", ate);
      return fetch(window.API_BASE + "/api/corretores?" + q.toString()).then(function (r) { return r.json(); });
    },
    renderizar: function (itens) {
      document.getElementById("contagem-corretores").textContent = itens.length + " corretor(es)";
      document.getElementById("cartoes-corretores").innerHTML = itens.length
        ? window.RENDERIZAR_CORRETORES(itens)
        : '<p class="painel__vazio">Nenhum corretor nesse período.</p>';
    },
    obterResumoItem: function (item) {
      return { telefone: item.telefone, ultima_interacao: item.ultima_interacao };
    },
  });
</script>
</body>
</html>
