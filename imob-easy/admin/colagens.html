<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colagens — Imob Easy</title>
<link rel="icon" href="../assets/img/logo-simbolo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<style>
  .painel-cartoes { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); margin-bottom:18px }
  .painel-cartao { background:var(--superficie,#fff); border:1px solid var(--linha,#e3e6ec); border-radius:12px; padding:14px 16px }
  .painel-cartao__n { font-family:Barlow,sans-serif; font-size:32px; font-weight:800; line-height:1.1 }
  .painel-cartao__r { font-size:var(--fs-xs); color:var(--texto-fraco); margin-top:2px }
  .painel-nota { font-size:var(--fs-xs); color:var(--texto-fraco); line-height:1.5; margin:8px 0 16px }
  .col-grade { display:grid; gap:16px; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)) }
  .col-card { border:1px solid var(--linha,#e3e6ec); border-radius:12px; overflow:hidden; background:var(--superficie,#fff) }
  .col-card img { display:block; width:100%; aspect-ratio:1/1; object-fit:cover; background:#f1f2f5 }
  .col-vazio { display:flex; align-items:center; justify-content:center; width:100%; aspect-ratio:1/1;
               background:#f6f7f9; color:var(--texto-fraco); font-size:var(--fs-xs); text-align:center; padding:12px }
  .col-card__txt { padding:10px 12px }
  .col-card__nome { font-weight:600; font-size:var(--fs-sm); line-height:1.3 }
  .col-card__sub { font-size:var(--fs-xs); color:var(--texto-fraco); margin-top:3px }
  .col-filtros { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px }
  .col-filtros button { cursor:pointer }
</style>
<meta name="facebook-domain-verification" content="xaq8qm93963to3xxpc459wh4vo301k" />
</head>
<body class="admin" data-pagina="colagens">

<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<div data-layout-topo></div>

<main class="conteudo" id="conteudo">
  <div class="pagina-cabecalho">
    <h1 class="pagina-titulo">Colagens de fotos</h1>
  </div>

  <p class="painel-nota">
    Uma imagem só por imóvel, com as <strong>4 primeiras fotos</strong> (a capa na frente), para mandar
    no lugar de quatro fotos soltas. Só entram imóveis disponíveis que tenham pelo menos 4 fotos.
    Quem monta é o gerador no servidor; esta página mostra o que já ficou pronto.
  </p>

  <div class="painel-cartoes" id="cartoes"></div>

  <div class="col-filtros">
    <button class="btn btn--secundario" id="btn-todos">Todos</button>
    <button class="btn btn--secundario" id="btn-faltando">Só os que faltam</button>
    <span class="painel-nota" id="aviso" style="margin:0"></span>
  </div>

  <div class="col-grade" id="grade"></div>
</main>

<div data-layout-rodape></div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/colagens.js"></script>
</body>
</html>
