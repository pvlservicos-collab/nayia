<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script src="../assets/js/tema-admin.js?v=20261031"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proprietários — Imob Easy</title>
<link rel="icon" href="../assets/img/logo-simbolo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/admin.css">
<meta name="facebook-domain-verification" content="xaq8qm93963to3xxpc459wh4vo301k" />
<style>
  /* 05/10 (Pedro): duas abas em lista, campos de pesquisa em cima, ordem pelo cabeçalho */
  .donos-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 12px; margin-bottom: 14px; }
  .donos-campos label { display: block; font-size: var(--fs-sm); color: var(--texto-fraco); margin-bottom: 4px; }
  .donos-barra { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .donos-ordem { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font: inherit; }
  .donos-ordem:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
  .donos-ordem[data-sentido]::after { content: "▲"; font-size: 9px; }
  .donos-ordem[data-sentido="desc"]::after { content: "▼"; }
  .donos-codigos { color: var(--texto-fraco); font-size: var(--fs-sm); }
  .tabela td.donos-quebra { word-break: break-word; }
  .abas__n { color: var(--texto-fraco); font-weight: 400; margin-left: 5px; font-size: var(--fs-xs); }
  .abas__item[aria-selected="true"] .abas__n { color: rgba(255, 255, 255, .8); }
</style>
</head>
<body class="admin" data-pagina="proprietarios">

<a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>

<div data-layout-topo></div>

<main class="conteudo" id="conteudo">
  <div class="pagina-cabecalho">
    <div>
      <h1 class="pagina-titulo">Proprietários</h1>
      <p class="pagina-subtitulo" id="subtitulo-pessoas"></p>
    </div>
    <button class="btn-azul" type="button" id="btn-exportar">Exportar (CSV)</button>
  </div>

  <div class="abas" role="tablist" aria-label="Proprietários" data-abas-funcionais>
    <button class="abas__item" role="tab" type="button" data-painel-abre="todos" aria-selected="true">Todos os proprietários <span class="abas__n" id="n-todos">—</span></button>
    <button class="abas__item" role="tab" type="button" data-painel-abre="contratos" aria-selected="false">Contratos a vencer <span class="abas__n" id="n-contratos">—</span></button>
  </div>

  <div data-painel="todos">
    <form id="filtros-pessoas" aria-label="Pesquisar proprietários" data-estado-proprio>
      <div class="donos-campos">
        <div><label for="f-nome">Nome</label><input class="entrada" id="f-nome" type="search" data-campo="nome" placeholder="Nome do proprietário"></div>
        <div><label for="f-telefone">Telefone</label><input class="entrada" id="f-telefone" type="search" inputmode="numeric" data-campo="telefone" placeholder="Qualquer parte do número"></div>
        <div><label for="f-email">E-mail</label><input class="entrada" id="f-email" type="search" data-campo="email" placeholder="E-mail"></div>
        <div><label for="f-cpf">CPF</label><input class="entrada" id="f-cpf" type="search" inputmode="numeric" data-campo="cpf" placeholder="CPF"></div>
        <div><label for="f-codigo">Código do imóvel</label><input class="entrada" id="f-codigo" type="search" inputmode="numeric" data-campo="codigo" placeholder="Ex.: 3050"></div>
        <div><label for="f-captacao">Captação</label>
          <select class="selecao" id="f-captacao" data-campo="captacao">
            <option value="">Todos</option>
            <option value="sim">Conectado pela captação</option>
            <option value="respondeu">Respondeu a captação</option>
            <option value="chamado">Chamado, sem resposta</option>
            <option value="fila">Na fila da captação</option>
            <option value="nao">Fora da captação</option>
          </select></div>
        <div><label for="f-imoveis">Imóveis</label>
          <select class="selecao" id="f-imoveis" data-campo="imoveis">
            <option value="">Todos</option><option value="com">Com imóvel</option><option value="sem">Sem imóvel</option>
          </select></div>
        <div><label for="f-etapa">Etapa</label><select class="selecao" id="f-etapa" data-campo="etapa"><option value="">Todas</option></select></div>
        <div><label for="f-especialista">Especialista</label><select class="selecao" id="f-especialista" data-campo="especialista"><option value="">Todos</option></select></div>
      </div>
    </form>

    <div class="donos-barra">
      <span class="contagem-lista" id="contagem-pessoas" style="margin:0">Carregando…</span>
      <button class="btn-neutro" type="button" id="btn-limpar">Limpar filtros</button>
    </div>

    <div class="tabela-envolucro">
      <div class="tabela-rolagem">
        <table class="tabela">
          <thead><tr>
            <th><button class="donos-ordem" type="button" data-ordem="antigos" data-ordem-desc="recentes" title="Ordem do cadastro">Cadastro</button></th>
            <th><button class="donos-ordem" type="button" data-ordem="nome" data-ordem-desc="nome_desc">Nome</button></th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th>CPF</th>
            <th><button class="donos-ordem" type="button" data-ordem="imoveis_asc" data-ordem-desc="imoveis">Imóveis</button></th>
            <th>Etapa</th>
            <th>Captação</th>
          </tr></thead>
          <tbody id="linhas-pessoas"></tbody>
        </table>
      </div>
    </div>
    <nav class="paginacao-sistema" aria-label="Paginação" id="pag-pessoas"></nav>
  </div>

  <div data-painel="contratos" hidden>
    <div class="donos-barra">
      <span class="contagem-lista" id="contagem-contratos" style="margin:0">Carregando…</span>
      <input class="entrada" id="c-busca" type="search" style="max-width:320px" placeholder="Nome, telefone, e-mail, código ou condomínio" aria-label="Pesquisar nos contratos">
    </div>
    <div class="tabela-envolucro">
      <div class="tabela-rolagem">
        <table class="tabela">
          <thead><tr>
            <th><button class="donos-ordem" type="button" data-coluna="vencimento">Vencimento</button></th>
            <th><button class="donos-ordem" type="button" data-coluna="nome">Proprietário</button></th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th><button class="donos-ordem" type="button" data-coluna="codigo">Imóvel</button></th>
            <th><button class="donos-ordem" type="button" data-coluna="condominio">Condomínio</button></th>
          </tr></thead>
          <tbody id="linhas-contratos"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div data-layout-rodape></div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/layout.js"></script>
<script src="../assets/js/admin.js"></script>
<script src="../assets/js/paginacao.js"></script>
<script>
(function () {
  function esc(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function dia(iso) { return iso ? new Date(iso + "T00:00:00").toLocaleDateString("pt-BR") : "—"; }
  function vazio(colunas, texto) { return '<tr><td colspan="' + colunas + '"><p class="painel__vazio">' + texto + "</p></td></tr>"; }
  function marcar(botoes, ativo, sentido) {
    botoes.forEach(function (b) {
      if (b === ativo) b.dataset.sentido = sentido; else delete b.dataset.sentido;
    });
  }

  // ---------- Aba 1: todos os proprietários ----------
  var POR = 50, pagina = 1, pedido = 0, ordem = "antigos";
  var campos = [].slice.call(document.querySelectorAll("#filtros-pessoas [data-campo]"));
  var botoesOrdem = [].slice.call(document.querySelectorAll("[data-ordem]"));
  var CAPTACAO = {
    respondendo: ["etiqueta--verde", "Captação: respondeu"], concluido: ["etiqueta--verde", "Captação: concluída"],
    enviado: ["etiqueta--azul-suave", "Captação: chamado"], novo: ["etiqueta--contorno-morno", "Na fila da captação"],
    sem_whatsapp: ["etiqueta--contorno-quente", "Captação: sem WhatsApp"]
  };
  function tagCaptacao(s) {
    var c = CAPTACAO[s];
    return c ? '<span class="etiqueta ' + c[0] + '">' + c[1] + "</span>" : '<span class="etiqueta">Fora da captação</span>';
  }
  function codigos(i) {
    if (!i.codigos) return "";
    var l = i.codigos.split(", ");
    return ' <span class="donos-codigos" title="' + esc(i.codigos) + '">(' + esc(l.slice(0, 5).join(", ")) +
      (l.length > 5 ? " +" + (l.length - 5) : "") + ")</span>";
  }
  function linha(i) {
    return "<tr><td class=\"num\">" + esc(i.id) + "</td><td>" + esc(i.nome) + "</td><td class=\"num\">" + esc(i.telefone) +
      '</td><td class="donos-quebra">' + esc(i.email) + '</td><td class="num">' + esc(i.cpf) + '</td><td class="num">' +
      esc(i.imoveis) + codigos(i) + "</td><td>" + esc(i.etapa) + "</td><td>" + tagCaptacao(i.captacao) + "</td></tr>";
  }
  function params(x) {
    var q = new URLSearchParams(x || {});
    campos.forEach(function (c) { if (c.value.trim()) q.set(c.dataset.campo, c.value.trim()); });
    q.set("ordem", ordem);
    return q;
  }
  function opcoes(sel, lista) {
    if (sel.options.length > 1) return;
    lista.forEach(function (t) { var o = document.createElement("option"); o.textContent = t; sel.appendChild(o); });
  }
  function carregar() {
    var meu = ++pedido;
    fetch(window.API_BASE + "/api/proprietarios-lista?" + params({ page: pagina, per: POR }).toString())
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (d) {
        if (meu !== pedido) return;
        var todos = d.funil.reduce(function (a, f) { return a + f.contagem; }, 0);
        document.getElementById("contagem-pessoas").textContent = d.total.toLocaleString("pt-BR") + " encontrado(s)";
        document.getElementById("n-todos").textContent = todos.toLocaleString("pt-BR");
        document.getElementById("subtitulo-pessoas").textContent = todos.toLocaleString("pt-BR") + " no total";
        document.getElementById("linhas-pessoas").innerHTML = d.itens.map(linha).join("") || vazio(8, "Ninguém com esses filtros.");
        opcoes(document.getElementById("f-etapa"), d.funil.map(function (f) { return f.rotulo; }));
        opcoes(document.getElementById("f-especialista"), d.especialistas || []);
        window.pintarPaginacao(document.getElementById("pag-pessoas"), pagina, d.total, POR, function (n) { pagina = n; carregar(); });
      })
      .catch(function () { if (meu === pedido) document.getElementById("linhas-pessoas").innerHTML = vazio(8, "Não foi possível carregar."); });
  }
  function recomecar() { pagina = 1; carregar(); }
  var espera;
  campos.forEach(function (c) {
    if (c.tagName === "SELECT") c.addEventListener("change", recomecar);
    else c.addEventListener("input", function () { clearTimeout(espera); espera = setTimeout(recomecar, 300); });
  });
  document.getElementById("filtros-pessoas").addEventListener("submit", function (e) { e.preventDefault(); recomecar(); });
  document.getElementById("btn-limpar").addEventListener("click", function () {
    campos.forEach(function (c) { c.value = ""; });
    recomecar();
  });
  botoesOrdem.forEach(function (b) {
    b.addEventListener("click", function () {
      var desce = ordem === b.dataset.ordem;
      ordem = desce ? b.dataset.ordemDesc : b.dataset.ordem;
      marcar(botoesOrdem, b, desce ? "desc" : "asc");
      recomecar();
    });
  });
  marcar(botoesOrdem, botoesOrdem[0], "asc");
  document.getElementById("btn-exportar").addEventListener("click", function () {
    window.location.href = window.API_BASE + "/api/proprietarios-lista?" + params({ formato: "csv", per: 5000 }).toString();
  });
  carregar();

  // ---------- Aba 2: contratos a vencer (de hoje em diante, o mais próximo primeiro) ----------
  var contratos = [], coluna = "vencimento", sobe = true;
  var botoesColuna = [].slice.call(document.querySelectorAll("[data-coluna]")), cBusca = document.getElementById("c-busca");
  function hojeEmManaus() { return new Date(Date.now() - 4 * 3600 * 1000).toISOString().slice(0, 10); }
  function faltam(iso) {
    var n = Math.round((new Date(iso + "T00:00:00") - new Date(hojeEmManaus() + "T00:00:00")) / 86400000);
    return n === 0 ? "hoje" : n === 1 ? "amanhã" : "em " + n + " dias";
  }
  function limpo(t) { return String(t == null ? "" : t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function pintarContratos() {
    var q = limpo(cBusca.value.trim()), dig = q.replace(/\D/g, "");
    var lista = contratos.filter(function (c) {
      if (!q) return true;
      return limpo([c.nome, c.email, c.codigo, c.condominio].join(" ")).indexOf(q) >= 0 ||
        (dig.length >= 3 && String(c.telefone || "").replace(/\D/g, "").indexOf(dig) >= 0);
    });
    lista.sort(function (a, b) {
      var x = a[coluna], y = b[coluna], r;
      if (coluna === "codigo" && !isNaN(x) && !isNaN(y)) r = Number(x) - Number(y);
      else r = limpo(x).localeCompare(limpo(y), "pt-BR");
      return sobe ? r : -r;
    });
    document.getElementById("contagem-contratos").textContent = lista.length.toLocaleString("pt-BR") + " contrato(s) a vencer";
    document.getElementById("linhas-contratos").innerHTML = lista.map(function (c) {
      return '<tr><td class="num">' + dia(c.vencimento) + ' <span class="donos-codigos">' + faltam(c.vencimento) + "</span></td><td>" +
        esc(c.nome) + '</td><td class="num">' + esc(c.telefone || "—") + '</td><td class="donos-quebra">' + esc(c.email || "—") +
        '</td><td class="num">' + esc(c.codigo || "—") + "</td><td>" + esc(c.condominio) + "</td></tr>";
    }).join("") || vazio(6, contratos.length ? "Nenhum contrato com essa pesquisa." : "Nenhum contrato a vencer.");
  }
  botoesColuna.forEach(function (b) {
    b.addEventListener("click", function () {
      sobe = coluna === b.dataset.coluna ? !sobe : true;
      coluna = b.dataset.coluna;
      marcar(botoesColuna, b, sobe ? "asc" : "desc");
      pintarContratos();
    });
  });
  marcar(botoesColuna, botoesColuna[0], "asc");
  cBusca.addEventListener("input", pintarContratos);
  fetch(window.API_BASE + "/api/proprietarios-vencimento?de=" + hojeEmManaus())
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (d) {
      contratos = d.filter(function (c) { return c.vencimento; });
      document.getElementById("n-contratos").textContent = contratos.length.toLocaleString("pt-BR");
      pintarContratos();
    })
    .catch(function () { document.getElementById("linhas-contratos").innerHTML = vazio(6, "Não foi possível carregar."); });
})();
</script>
</body>
</html>
