<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- Gerado por scripts/montar_pagina_do_imovel.py a partir de Novateladeverimovel.html. Não edite aqui: edite o desenho e gere de novo. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imóvel · Imob Easy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@1.50.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#F7F2FB; --surface:#FFFFFF; --soft:#F6F1FC; --ink:#17121F; --ink-2:#3A3150; --muted:#7A7290; --line:#E8E0F2;
  --brand:#6D28D9; --brand-2:#8B3CF0; --brand-dark:#4A1D96; --brand-soft:#F1E8FF;
  --ok:#14865C; --ok-soft:#E8F6EF;
  --shadow:0 2px 6px rgba(74,29,150,.05),0 10px 30px rgba(74,29,150,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 86px);scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;
  background:radial-gradient(1200px 600px at 85% 10%,#EBDDFA 0%,transparent 60%),radial-gradient(900px 500px at 0% 60%,#F5E6F5 0%,transparent 60%),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.lucide{width:18px;height:18px;flex:none;stroke-width:2}

/* topo do site */
.site{position:sticky;top:0;z-index:30;background:#fff;box-shadow:0 2px 14px rgba(74,29,150,.07);padding-top:env(safe-area-inset-top,0px)}
.site-in{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
/* 06/10 (Pedro): a seta de voltar à esquerda e a logo à direita */
.logo{display:flex;align-items:center;gap:6px;text-decoration:none;line-height:.85;margin-left:auto}
.voltar{flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--brand-dark);cursor:pointer;display:grid;place-items:center}
.voltar:hover{background:var(--brand-soft)}
.voltar svg.lucide{width:22px;height:22px}
/* O MAPA É O MESMO DO /imoveis (06/10): OpenStreetMap com o filtro escuro, divisas e nomes dos bairros, e o pino
   roxo com o preço. As regras são as de imoveis.html. */
.map.mapa--escuro{background:#1d1b22}
.mapa--escuro .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) grayscale(1) brightness(.92) contrast(.88)}
.leaflet-tooltip.ux-rotulo-bairro{background:transparent;border:0;box-shadow:none;font-weight:700;font-size:11px;white-space:nowrap;padding:0;color:#ede9fe;text-shadow:0 0 3px #000,0 0 3px #000}
.leaflet-tooltip.ux-rotulo-bairro::before{display:none}
.map .leaflet-container,.map.leaflet-container{font-family:inherit}
.map .leaflet-control-attribution{font-size:10.5px;background:rgba(255,255,255,.8)!important}
.pinw{width:0!important;height:0!important;border:0;background:transparent}
.ux-preco-pin{position:absolute;left:0;top:0;transform:translate(-50%,calc(-100% - 9px));white-space:nowrap;
  font:700 12px/1 "Barlow",Arial,sans-serif;letter-spacing:.01em;color:#fff;padding:5px 8px;border-radius:7px;font-variant-numeric:tabular-nums;
  background:linear-gradient(160deg,#a78bfa 0%,#7c3aed 45%,#4c1d95 100%);box-shadow:0 1px 4px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.3)}
.ux-preco-pin::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-top:8px solid #ddd6fe}
.ux-preco-pin::before{content:"";position:absolute;left:50%;top:calc(100% + 7px);width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #7c3aed,0 0 3px rgba(0,0,0,.6)}
.logo .mk{width:34px;height:30px}
.logo .w{display:flex;flex-direction:column;font-weight:700;color:var(--brand-dark)}
.logo .w small{font-size:14px;margin-left:4px}
.logo .w span{font-size:25px;letter-spacing:-.02em}
.mode{margin-left:auto;display:flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.mode button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:500;font-size:13.5px;cursor:pointer;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--brand);color:#fff}
.btn-o{border:1.5px solid #CDB8F0;background:#fff;color:var(--brand);border-radius:999px;padding:9px 16px;font-weight:600;font-size:13px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn-o:hover{background:var(--brand-soft)}
.btn{border:0;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-radius:999px;padding:12px 18px;font-weight:600;font-size:13.5px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 20px rgba(109,40,217,.28);display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:hover{filter:brightness(1.06)}

/* layout */
.page{max-width:1280px;margin:0 auto;padding:18px 24px 120px;overflow-x:clip}
.layout{display:grid;grid-template-columns:190px minmax(0,1fr) 320px;gap:22px;align-items:start}

/* menu lateral */
.nav{position:sticky;top:86px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:var(--shadow);display:grid;gap:2px}
.nav button{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;font-weight:500;font-size:14px;color:var(--ink-2)}
.nav button:hover{background:var(--soft)}
.nav .n{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.nav button svg{color:var(--brand)}
.nav button.act{background:var(--brand-soft);color:var(--brand-dark);font-weight:600}
.nav button.act .n{background:var(--brand);color:#fff}

/* ficha do título */
.fic{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:12px}
.fic-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tag-t{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);padding:3px 9px;border-radius:6px}
.code{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.code svg{width:14px;height:14px}
.fic h1{margin:0;font-size:24px;line-height:1.2;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.fic .condo{margin:6px 0 2px;font-size:15px;color:var(--muted)}
.fic .condo b{color:var(--ink);font-weight:600}
.fic .loc{display:flex;align-items:center;gap:6px;font-size:14.5px;color:var(--muted)}
.fic .loc svg{width:16px;height:16px;color:var(--brand)}
.specs{display:flex;flex-wrap:wrap;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;gap:8px 18px}
.spec{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);white-space:nowrap}
.spec svg{width:16px;height:16px;color:var(--brand)}
.spec b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

/* galeria */
/* 06/10 (Pedro): a foto no topo, sem card nem borda atrás, quadrada e sem padding */
.gal{margin-bottom:12px}
.stage{position:relative;aspect-ratio:16/10;width:100%;max-height:75vh;border-radius:0;overflow:hidden;background:#EDE6F7;touch-action:pan-y}
.stage img{width:100%;height:100%;max-width:100%;object-fit:cover;display:block}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.94);box-shadow:0 4px 14px rgba(0,0,0,.15);cursor:pointer;color:var(--brand-dark);display:grid;place-items:center}
.arrow svg{width:22px;height:22px}
.arrow.l{left:12px}.arrow.r{right:12px}
.count{position:absolute;right:12px;bottom:12px;background:rgba(23,18,31,.72);color:#fff;font-size:13px;font-weight:500;padding:4px 10px;border-radius:999px}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.thumbs button{flex:0 0 92px;aspect-ratio:4/3;border-radius:0;overflow:hidden;border:2.5px solid transparent;padding:0;cursor:pointer;background:#EDE6F7;opacity:.7}
.thumbs button img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs button.on{border-color:var(--brand);opacity:1}

/* blocos */
.blk{background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:12px;box-shadow:var(--shadow)}
.blk-h{display:flex;align-items:center;gap:10px;padding:12px 16px 0}
.blk-h .n{width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.blk-h h2{margin:0;font-size:16.5px;font-weight:600;color:var(--brand-dark)}
.blk-b{padding:10px 16px 16px}
.sub-t{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:4px 0 8px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.kv div{background:var(--soft);border-radius:10px;padding:7px 10px;min-width:0}
.kv small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.kv b{display:block;font-size:15px;font-weight:500;color:var(--ink);overflow-wrap:anywhere}
.kv + .sub-t,.desc + .sub-t{margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 9px;font-size:14px;font-weight:400;color:var(--ink)}
.pill svg{width:16px;height:16px;color:var(--brand)}
.none{font-size:13.5px;color:var(--muted);margin:0}
.desc{white-space:pre-line;margin:0;font-size:15px;color:var(--ink-2);background:var(--soft);border-radius:12px;padding:10px 12px}

/* mapa */
.map{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:21/9;background:#E9EEF0;border:1px solid var(--line)}
.map svg.mp{width:100%;height:100%;display:block}
.maptag{position:absolute;left:12px;top:12px;background:#fff;border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;align-items:center;gap:5px}
.maptag svg{width:14px;height:14px;color:var(--brand)}
.addr{margin:10px 0 12px}
.addr b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.addr small{color:var(--muted);font-size:13.5px}

/* coluna direita */
.aside{position:sticky;top:86px;display:grid;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.price small{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.price .big{font-size:30px;font-weight:600;color:var(--ink);line-height:1.05;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.price .big span{font-size:15px;font-weight:400;color:var(--muted)}
.rows div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.rows div span:first-child{color:var(--muted)}
.rows div b{font-weight:500}
.rows .na{color:var(--muted);font-weight:500;font-style:italic}
.rows .tot{border-top:1.5px solid var(--line);padding-top:9px;margin-top:2px}
.rows .tot b{color:var(--brand-dark);font-size:15.5px;font-weight:600}
.card h3{margin:0 0 4px;font-size:16px;font-weight:600;color:var(--brand-dark)}
.card p.h{margin:0 0 12px;font-size:13px;color:var(--muted)}
.acts{display:grid;gap:8px}
.btn .two-l{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15;text-align:left}
.btn .two-l small{font-size:11px;font-weight:400;letter-spacing:.02em;text-transform:none;opacity:.85}
.add[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.price-m{display:none}
.fl{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:6px}
.phone{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:11px 12px;font-size:16px;font-variant-numeric:tabular-nums;outline:none}
.phone:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.phone.bad{border-color:#D92D20}
.err{min-height:0;margin:4px 0 8px;font-size:12.5px;color:#B42318}
.err:empty{margin:0 0 10px}
.cart-phone{padding:12px 14px 4px;border-bottom:1px solid var(--line);background:#FBF9FE}

/* lista de envio (fica no canto, acompanha a navegação) */
.dock{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.dock-btn{display:flex;align-items:center;gap:10px;border:0;background:var(--brand-dark);color:#fff;border-radius:999px;padding:12px 16px 12px 14px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 10px 30px rgba(74,29,150,.35)}
.dock-btn .badge{background:#fff;color:var(--brand-dark);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12.5px;padding:0 6px}
.dock-btn.pulse{animation:pulse .6s ease}
@keyframes pulse{50%{transform:scale(1.08)}}
.panel{width:min(360px,calc(100vw - 32px));max-height:min(520px,70vh);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 50px rgba(74,29,150,.25);display:none;flex-direction:column;overflow:hidden}
.dock.open .panel{display:flex}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 16px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
.panel-h b{font-size:15.5px;font-weight:600}
.panel-h small{display:block;font-size:12.5px;opacity:.85}
.panel-h button{margin-left:auto;border:0;background:rgba(255,255,255,.18);color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
/* 06/10: a linha do imóvel não pode alargar a lista (o título comprido empurrava a lixeira para fora e criava
   rolagem de lado, com um vão estranho embaixo do número): a coluna do texto encolhe e corta com reticências */
.items{overflow-y:auto;overflow-x:hidden;padding:8px;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:6px;flex:1;min-height:0}
.item>div{min-width:0}
.item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px;border-radius:12px;background:var(--soft)}
.item.new{animation:flash 1.2s ease}
@keyframes flash{0%{background:#E2D2FF}100%{background:var(--soft)}}
.item img{width:56px;height:44px;border-radius:8px;object-fit:cover;display:block}
.item b{display:block;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item small{display:block;font-size:12.5px;color:var(--muted)}
.item button{border:0;background:transparent;color:var(--muted);cursor:pointer;width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.item button:hover{background:#fff;color:#B42318}
.item button svg{width:16px;height:16px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.panel-f{padding:10px 12px 12px;border-top:1px solid var(--line);display:grid;gap:6px}
.panel-f .clear{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}

.mbar{display:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* tablet: menu vira trilho de ícones à esquerda */
@media (max-width:1180px){
  .layout{grid-template-columns:64px minmax(0,1fr) 300px;gap:16px}
  .nav{padding:6px 4px}
  .nav button{flex-direction:column;gap:3px;padding:8px 2px;font-size:10.5px;text-align:center;line-height:1.1}
  .nav button svg{width:20px;height:20px}
  .nav .n{position:absolute;top:3px;left:6px;width:16px;height:16px;font-size:10px}
}
/* celular: sem menu lateral, fotos ocupam a largura toda */
@media (max-width:860px){
  .page{padding:0 12px 150px}
  .layout{grid-template-columns:minmax(0,1fr);gap:0}
  .nav{display:none}
  main{display:flex;flex-direction:column}
  .gal{order:-1;width:auto;max-width:none;margin:0 -12px 12px;border:0;border-radius:0;padding:0;box-shadow:none;background:transparent}
  .stage{border-radius:0;aspect-ratio:4/3}
  .thumbs{padding:0 12px}
  .thumbs button{flex-basis:72px}
  .arrow{width:36px;height:36px}
  .aside{position:static;margin-top:12px}
  .aside .price{display:none}
  .price-m{display:block;margin-top:12px}
  .two{grid-template-columns:1fr}
  .fic{padding:14px}
  .fic h1{font-size:20px}
  .blk-b{padding:10px 12px 14px}
  .blk-h{padding:12px 12px 0}
  .map{aspect-ratio:4/3}
  .mbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:45;background:#fff;box-shadow:0 -4px 18px rgba(74,29,150,.1);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
  .mbar button{font-size:12px;padding:12px 8px;letter-spacing:.03em}
  .dock{right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .dock-btn{padding:10px 14px 10px 12px;font-size:13px}
  .panel{max-height:calc(100vh - 170px)}
  .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
  html{scroll-padding-top:70px}
}
/* celulares pequenos (até 400px) */
@media (max-width:400px){
  .site-in{padding:10px 12px}
  .logo .mk{width:28px;height:25px}
  .logo .w small{font-size:12px}
  .logo .w span{font-size:19px}
  .page{padding:0 10px 150px}
  .gal{margin:0 -10px 10px}
  .fic{padding:12px;border-radius:14px}
  .fic h1{font-size:18px}
  .fic .condo{font-size:14px}
  .fic .loc{font-size:13.5px}
  .specs{gap:6px 12px}
  .spec{font-size:13px}
  .code{margin-left:0}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv b{font-size:14px}
  .pill{font-size:13px;padding:4px 10px 4px 8px}
  .price .big{font-size:26px}
  .thumbs button{flex-basis:62px}
  .card{padding:14px;border-radius:14px}
  .mbar{padding-left:8px;padding-right:8px}
  .mbar button{font-size:11px;padding:11px 4px;gap:5px}
  .mbar svg.lucide{width:15px;height:15px}
  .dock-btn{font-size:12px;padding:9px 12px 9px 10px}
}
/* ÍCONE NO CENTRO DO BOTÃO (06/10, Pedro: "os ícones estão todos descentralizados" no celular): o navegador do
   celular põe um recuo próprio dentro de todo <button>; num botão redondo pequeno isso empurra o ícone para o
   lado. Todo botão que é só ícone fica sem recuo, com o ícone como bloco no meio. */
.voltar,.arrow,.panel-h button,.item button{padding:0;line-height:0;-webkit-appearance:none;appearance:none;display:grid;place-items:center;place-content:center}
.voltar svg,.arrow svg,.panel-h button svg,.item button svg{display:block;margin:0;flex:none}
.btn svg,.btn-o svg,.dock-btn svg,.nav button svg,.spec svg,.loc svg,.pill svg,.code svg{flex:none}
</style>
</head>
<body>

<header class="site">
  <div class="site-in">
