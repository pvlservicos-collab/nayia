version: "3.8"
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: follemcrm
      POSTGRES_USER: follemcrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD antes de rodar docker stack deploy}
    volumes:
      - follemcrm_db_data:/var/lib/postgresql/data
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  follemcrm_db_data:
